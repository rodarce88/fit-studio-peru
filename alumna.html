<!DOCTYPE html>
<html lang="es" data-size="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FIT Studio · Mi cuenta</title>
<meta name="app-build" content="b28-2026-07-02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B2A8F; --purple-deep:#3C1D6E; --purple-soft:#EDE6F7; --purple-pale:#F6F1FC;
    --cream:#FBF8F2; --ink:#211C29; --ink-soft:#574F60; --ink-mute:#928D9B; --line:#ECE6DE; --line-strong:#DCD5CB;
    --gold:#C89B4F; --green-deep:#149A4A; --red:#E24B4A; --chip-green:#EAF6EC; --chip-green-ink:#2E7D45;
    --display:'Playfair Display',Georgia,serif; --body:'Mulish',system-ui,sans-serif; --scale:1; }
  html[data-size="lg"]{ --scale:1.16; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{ font-family:var(--body); background:var(--cream); color:var(--ink); display:flex; justify-content:center; font-size:calc(17px*var(--scale)); line-height:1.5; }
  .phone{ width:100%; max-width:430px; height:100vh; height:100dvh; overflow:hidden; position:relative; display:flex; flex-direction:column; background:var(--cream); }
  .hidden{ display:none !important; }
  .logo-f{ width:72px; height:72px; border-radius:22px; background:linear-gradient(145deg,#6E37A6,#3C1D6E); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; color:#fff; font-size:38px; box-shadow:0 10px 24px rgba(60,29,110,.32); }
  .spinner{ width:34px; height:34px; border:3px solid #E7E0F0; border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .center{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; -webkit-overflow-scrolling:touch; }
  .center-inner{ margin:auto; width:100%; padding:42px 26px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .center h1{ font-family:var(--display); font-weight:600; font-size:calc(27px*var(--scale)); margin:22px 0 8px; }
  .center p{ color:var(--ink-soft); font-size:calc(17px*var(--scale)); max-width:330px; }
  .center .err{ color:var(--red); }
  .data-list{ width:100%; text-align:left; margin:24px 0 8px; border-top:1px solid var(--line); }
  .data-list .r{ display:flex; justify-content:space-between; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); font-size:calc(16px*var(--scale)); }
  .data-list .r .lab{ color:var(--ink-mute); } .data-list .r .val{ font-weight:700; text-align:right; }
  .session-note{ font-size:calc(14px*var(--scale)); color:var(--ink-mute); margin:14px 0 22px; }
  .btn{ width:100%; border:0; border-radius:16px; font-family:var(--body); font-size:calc(19px*var(--scale)); font-weight:700; padding:19px 20px; cursor:pointer; background:var(--purple); color:#fff; box-shadow:0 8px 20px rgba(91,42,143,.28); transition:background .25s ease; }
  .btn.saved{ background:#1D9E75; box-shadow:0 8px 20px rgba(29,158,117,.26); }
  /* Tarjeta de calificación de clase (inicio) */
  .rate-card{ background:linear-gradient(135deg,#F6F1FC,#FDF8EF); border:1.5px solid #E4D8F3; border-radius:20px; padding:20px 18px; margin:4px 0 22px; }
  .rate-card .rc-t{ font-family:var(--display); font-size:calc(23px*var(--scale)); color:var(--ink); }
  .rate-card .rc-t em{ font-style:italic; color:var(--purple); }
  .rate-card .rc-s{ font-size:calc(14px*var(--scale)); color:var(--ink-soft); margin:3px 0 10px; }
  .rc-stars{ display:flex; gap:10px; justify-content:center; padding:6px 0 2px; }
  .rc-stars button{ border:0; background:transparent; padding:2px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rc-stars svg{ width:40px; height:40px; fill:none; stroke:#C9BFD6; stroke-width:1.6; transition:transform .12s; }
  .rc-stars button.on svg{ fill:#F0B429; stroke:#F0B429; }
  .rc-stars button:active svg{ transform:scale(1.15); }
  .rc-more{ margin-top:12px; }
  .rc-more textarea{ width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; font-family:var(--body); font-size:calc(16px*var(--scale)); color:var(--ink); background:#fff; resize:none; min-height:76px; outline:none; }
  .rc-more textarea:focus{ border-color:var(--purple); }
  .rc-more .btn{ margin-top:10px; padding:15px 20px; font-size:calc(17px*var(--scale)); }
  .rc-skip{ text-align:center; color:var(--ink-soft); font-size:calc(15px*var(--scale)); padding:12px 0 2px; cursor:pointer; }
  .rc-thanks{ text-align:center; font-weight:700; color:#1D9E75; font-size:calc(17px*var(--scale)); padding:10px 0; }
  .mini-stars{ display:inline-flex; gap:1.5px; vertical-align:-2px; margin-left:3px; }
  .mini-stars svg{ width:calc(13px*var(--scale)); height:calc(13px*var(--scale)); stroke-width:1.8; }
  .rated-note{ color:#00AA6C; font-size:calc(12.5px*var(--scale)); font-weight:600; margin-top:3px; }
  .btn.confirmed{ background:#0E7A4F; box-shadow:0 8px 20px rgba(14,122,79,.26); }
  .btn:disabled{ opacity:.65; cursor:default; }
  .sbox{ width:100%; border-radius:16px; padding:17px 18px; font-weight:700; font-size:calc(18px*var(--scale)); text-align:center; }
  .sbox.ok{ background:#E8F5EF; color:#0E7A4F; }
  .sbox.lost{ background:#FBEAEA; color:#B42318; }
  .sbox.rec{ background:#FFF3E3; color:#A85B08; }
  .sbox.repro{ background:#EAF0FB; color:#2B59B0; }
  .sbox.neutral{ background:#F0EDF6; color:#5B2A8F; }
  .sbox.aviso{ background:#FBF2DE; color:#A85B08; }
  .btn:active{ transform:scale(.985); }
  .btn.ghost{ background:#fff; color:var(--purple); box-shadow:none; border:1.5px solid var(--purple-soft); }
  .btn.danger{ background:#C0392B; box-shadow:0 8px 20px rgba(192,57,43,.22); }
  .linkbtn{ width:100%; border:0; background:transparent; color:var(--ink-mute); font-family:var(--body); font-weight:700; font-size:calc(15px*var(--scale)); padding:14px 0 2px; cursor:pointer; text-decoration:underline; }
  /* botón de todo el paquete (distinto al sólido morado) */
  .packbtn{ width:100%; border:1.5px solid var(--purple-soft); background:#fff; border-radius:16px; padding:15px 16px; margin-top:14px; cursor:pointer; display:flex; align-items:center; gap:13px; text-align:left; font-family:var(--body); }
  .packbtn:active{ transform:scale(.99); }
  .packbtn .pic{ width:42px; height:42px; border-radius:12px; flex:none; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; }
  .packbtn .pic svg{ width:22px; height:22px; stroke:var(--purple); }
  .packbtn .ptx{ flex:1; min-width:0; }
  .packbtn .pt{ display:block; font-weight:700; font-size:calc(16px*var(--scale)); color:var(--purple-deep); }
  .packbtn .ps{ display:block; font-size:calc(13px*var(--scale)); color:var(--ink-mute); margin-top:1px; }
  .packbtn .parr{ color:var(--ink-faint); font-size:calc(22px*var(--scale)); }
  .packbtn.some{ border-color:#BFE6D5; background:#E8F5EF; }
  .packbtn.some .pic{ background:#fff; } .packbtn.some .pic svg{ stroke:#0E7A4F; }
  .packbtn.some .pt{ color:#0E7A4F; } .packbtn.some .ps{ color:#3E8C70; } .packbtn.some .parr{ color:#0E7A4F; }
  /* pill de estado en filas */
  .pill{ border:0; border-radius:999px; padding:10px 15px; font-weight:700; font-size:calc(13.5px*var(--scale)); white-space:nowrap; cursor:pointer; font-family:var(--body); flex:none; }
  .pill.todo{ background:var(--purple-soft); color:var(--purple-deep); }
  .pill.done{ background:#E8F5EF; color:#0E7A4F; }
  .pill.aviso{ background:#FBF2DE; color:#A85B08; }
  .pill.rec{ background:#FFF3E3; color:#A85B08; } .pill.repro{ background:#EAF0FB; color:#2B59B0; } .pill.lost{ background:#FBEAEA; color:#B42318; }
  /* hoja (sheet) */
  .sheet-ov{ position:fixed; inset:0; background:rgba(34,26,43,.45); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; overscroll-behavior:contain; }
  .sheet-ov.show{ opacity:1; pointer-events:auto; }
  .sheet-panel{ width:100%; max-width:460px; background:var(--cream); border-radius:26px 26px 0 0; padding:26px 22px calc(26px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.2); transform:translateY(18px); transition:transform .22s; max-height:88vh; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .sheet-ov.show .sheet-panel{ transform:translateY(0); }
  .sh-h{ font-family:var(--display); font-weight:600; font-size:calc(24px*var(--scale)); line-height:1.15; }
  .sh-sub{ color:var(--ink-soft); font-size:calc(15px*var(--scale)); margin:6px 0 4px; }
  .sh-note{ border-radius:14px; padding:14px 16px; margin:16px 0; font-size:calc(14.5px*var(--scale)); line-height:1.5; }
  .sh-note.amber{ background:#FBF2DE; color:#7a5a16; } .sh-note.red{ background:#FBEAEA; color:#9B2C20; } .sh-note.ok{ background:#E8F5EF; color:#0E7A4F; }
  .sheet-panel .btn, .sheet-panel .linkbtn{ margin-top:10px; }
  .pf-field{ margin-top:12px; }
  .pf-lab{ display:block; font-size:calc(12px*var(--scale)); font-weight:700; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em; }
  .pf-in{ width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-family:var(--body); font-size:calc(15px*var(--scale)); background:#fff; color:var(--ink); }
  .pf-in:focus{ outline:none; border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-pale); }
  .pf-row{ display:flex; gap:10px; } .pf-row .pf-field{ flex:1; }
  .pf-consent{ margin-top:18px; padding:13px 15px; border-radius:14px; font-size:calc(13.5px*var(--scale)); font-weight:700; display:flex; flex-direction:column; gap:3px; }
  .pf-consent span{ font-weight:500; font-size:calc(12.5px*var(--scale)); }
  .pf-consent.ok{ background:#E8F5EF; color:#0E7A4F; } .pf-consent.ok span{ color:#3d7a5f; }
  .pf-consent.pend{ background:#FBF2DE; color:#7a5a16; } .pf-consent.pend span{ color:#8a6a26; }
  /* Perfil a pantalla completa (fijo, no se mueve) */
  .pf-screen{ position:absolute; inset:0; z-index:60; background:var(--cream); display:flex; flex-direction:column; overflow-x:hidden; transform:translateX(100%); transition:transform .26s cubic-bezier(.32,.72,.24,1); visibility:hidden; }
  .pf-screen.show{ transform:translateX(0); visibility:visible; }
  .pf-bar{ display:flex; align-items:center; gap:10px; padding:16px 18px 10px; flex:none; }
  .pf-back{ width:38px; height:38px; border-radius:50%; border:0; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); font-size:22px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pf-bar .ttl{ font-family:var(--display); font-weight:600; font-size:calc(21px*var(--scale)); }
  .pf-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:6px 20px calc(30px + env(safe-area-inset-bottom)); }
  .pf-hero{ display:flex; flex-direction:column; align-items:center; padding:10px 0 16px; }
  .pf-hero .av{ width:76px; height:76px; border-radius:50%; background:var(--purple-soft); color:var(--purple-deep); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:calc(27px*var(--scale)); margin-bottom:10px; }
  .pf-hero .nm{ font-family:var(--display); font-weight:600; font-size:calc(23px*var(--scale)); color:var(--ink); text-align:center; line-height:1.15; }
  .pf-hero .ph{ font-size:calc(14px*var(--scale)); color:var(--ink-mute); margin-top:3px; }
  .pf-sec{ font-size:calc(11px*var(--scale)); font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-mute); margin:20px 2px 10px; }
  .pf-disc{ width:100%; border:1.5px solid var(--purple-soft); background:#fff; border-radius:16px; padding:14px 15px; display:flex; align-items:center; gap:13px; cursor:pointer; font-family:var(--body); text-align:left; }
  .pf-disc:active{ transform:scale(.99); }
  .pf-disc .pic{ width:42px; height:42px; border-radius:12px; flex:none; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; }
  .pf-disc .pic svg{ width:22px; height:22px; stroke:var(--purple); }
  .pf-disc .chev{ margin-left:auto; color:var(--purple); font-size:22px; font-weight:600; transition:transform .2s; flex:none; }
  .pf-disc.open .chev{ transform:rotate(90deg); }
  /* teléfono con código de país */
  .pf-phrow{ display:flex; gap:8px; }
  .pf-phrow select{ width:108px; flex:none; padding-left:10px; padding-right:6px; }
  .pf-phrow input{ flex:1; min-width:0; }
  /* errores de validación */
  .pf-err{ display:none; color:#B42318; font-size:calc(12px*var(--scale)); font-weight:600; margin-top:4px; }
  .pf-err.show{ display:block; }
  .pf-in.err{ border-color:#B42318; box-shadow:0 0 0 3px #FBEAEA; }
  /* alerta lineamientos en perfil */
  .pf-lnalert{ width:100%; border:0; background:#FBF2DE; border-radius:16px; padding:14px 15px; display:flex; align-items:center; gap:13px; cursor:pointer; font-family:var(--body); text-align:left; margin-top:10px; }
  .pf-lnalert .pic{ width:42px; height:42px; border-radius:12px; flex:none; background:#F5E4BC; display:flex; align-items:center; justify-content:center; }
  .pf-lnalert .pic svg{ width:22px; height:22px; stroke:#A85B08; }
  .pf-lnalert .t1{ font-weight:800; color:#7a5a16; font-size:calc(14.5px*var(--scale)); }
  .pf-lnalert .t2{ font-size:calc(12px*var(--scale)); color:#8a6a26; margin-top:1px; }
  .pf-lnalert .chev{ margin-left:auto; color:#A85B08; font-size:22px; flex:none; }
  /* banner lineamientos en inicio */
  .ln-banner{ width:100%; border:0; border-radius:16px; padding:15px 16px; display:flex; align-items:center; gap:13px; cursor:pointer; font-family:var(--body); text-align:left; margin:12px 0 4px; }
  .ln-banner.new{ background:var(--purple); }
  .ln-banner.new .t1{ color:#fff; } .ln-banner.new .t2{ color:#D9C8F2; } .ln-banner.new .chev{ color:#fff; }
  .ln-banner.new .pic{ background:rgba(255,255,255,.16); } .ln-banner.new .pic svg{ stroke:#fff; }
  .ln-banner.half{ background:#FBF2DE; }
  .ln-banner.half .t1{ color:#7a5a16; } .ln-banner.half .t2{ color:#8a6a26; } .ln-banner.half .chev{ color:#A85B08; }
  .ln-banner.half .pic{ background:#F5E4BC; } .ln-banner.half .pic svg{ stroke:#A85B08; }
  .ln-banner .pic{ width:42px; height:42px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; }
  .ln-banner .pic svg{ width:22px; height:22px; }
  .ln-banner .t1{ font-weight:800; font-size:calc(14.5px*var(--scale)); }
  .ln-banner .t2{ font-size:calc(12px*var(--scale)); margin-top:1px; }
  .ln-banner .chev{ margin-left:auto; font-size:22px; flex:none; }
  /* pantalla de lineamientos */
  .ln-screen{ position:absolute; inset:0; z-index:75; background:var(--cream); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,.24,1); visibility:hidden; }
  .ln-screen.show{ transform:translateY(0); visibility:visible; }
  .ln-body{ flex:1; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 30px; }
  .ln-ic{ width:88px; height:88px; border-radius:50%; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
  .ln-ic svg{ width:40px; height:40px; stroke:var(--purple); }
  .ln-ic.done{ background:#E8F5EF; } .ln-ic.done svg{ stroke:#0E7A4F; }
  .ln-ttl{ font-family:var(--display); font-weight:600; font-size:calc(24px*var(--scale)); line-height:1.2; color:var(--ink); margin-bottom:12px; }
  .ln-txt{ font-size:calc(15.5px*var(--scale)); line-height:1.6; color:var(--ink-soft); max-width:320px; }
  .ln-dots{ display:flex; gap:7px; justify-content:center; margin-top:26px; }
  .ln-dots i{ width:8px; height:8px; border-radius:50%; background:var(--purple-soft); }
  .ln-dots i.on{ background:var(--purple); width:22px; border-radius:4px; }
  .ln-foot{ flex:none; padding:14px 24px calc(20px + env(safe-area-inset-bottom)); }
  .ln-count{ text-align:center; font-size:calc(12px*var(--scale)); font-weight:700; color:var(--ink-mute); margin-bottom:10px; letter-spacing:.03em; }
  .pf-more{ overflow:hidden; }
  .pf-note-ro{ background:var(--purple-pale); border-radius:14px; padding:13px 15px; font-size:calc(13.5px*var(--scale)); color:var(--ink-soft); line-height:1.5; }
  .pf-dateBtn{ width:100%; text-align:left; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#fff; font-family:var(--body); font-size:calc(15px*var(--scale)); color:var(--ink); cursor:pointer; }
  .pf-dateBtn.empty{ color:var(--ink-mute); }
  /* Calendario propio (nacimiento) */
  .bp-ov{ position:absolute; inset:0; z-index:80; background:rgba(20,16,26,.42); display:flex; align-items:center; justify-content:center; padding:22px; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .18s, visibility .18s; }
  .bp-ov.show{ opacity:1; visibility:visible; pointer-events:auto; }
  .bp-step{ font-size:calc(11px*var(--scale)); font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--purple); margin-bottom:2px; }
  .bp-backbtn{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:18px; color:var(--ink-soft); cursor:pointer; margin-right:8px; flex:none; }
  .bp-months{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .bp-mo{ padding:13px 0; border:1px solid var(--line); background:#fff; border-radius:10px; font-family:var(--body); font-size:calc(14px*var(--scale)); color:var(--ink); cursor:pointer; text-transform:capitalize; }
  .bp-mo.sel{ background:var(--purple); color:#fff; border-color:var(--purple); font-weight:700; }
  .bp-card{ width:100%; max-width:340px; background:#fff; border-radius:22px; padding:16px; box-shadow:0 20px 50px rgba(0,0,0,.28); }
  .bp-head{ display:flex; align-items:center; margin-bottom:10px; }
  .bp-title{ font-family:var(--display); font-weight:600; font-size:calc(18px*var(--scale)); color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:4px; }
  .bp-title .car{ color:var(--purple); font-size:14px; }
  .bp-nav{ margin-left:auto; display:flex; gap:6px; }
  .bp-nav button{ width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:18px; color:var(--ink-soft); cursor:pointer; }
  .bp-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .bp-dow{ text-align:center; font-size:10.5px; font-weight:800; color:var(--ink-mute); padding:4px 0; }
  .bp-day{ aspect-ratio:1; border:0; background:transparent; border-radius:10px; font-family:var(--body); font-size:calc(14px*var(--scale)); color:var(--ink); cursor:pointer; }
  .bp-day:hover{ background:var(--purple-pale); }
  .bp-day.sel{ background:var(--purple); color:#fff; font-weight:700; }
  .bp-day.empty{ visibility:hidden; }
  .bp-years{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:280px; overflow-y:auto; }
  .bp-yr{ padding:11px 0; border:1px solid var(--line); background:#fff; border-radius:10px; font-family:var(--body); font-size:calc(14px*var(--scale)); color:var(--ink); cursor:pointer; }
  .bp-yr.sel{ background:var(--purple); color:#fff; border-color:var(--purple); font-weight:700; }
  /* Consentimiento (visor) */
  .cv-screen{ position:absolute; inset:0; z-index:70; background:var(--cream); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,.24,1); visibility:hidden; }
  .cv-screen.show{ transform:translateY(0); visibility:visible; }
  .cv-scroll{ flex:1; overflow-y:auto; padding:8px 22px 20px; }
  .cv-cl{ margin-bottom:16px; }
  .cv-cl .cn{ font-size:calc(11px*var(--scale)); font-weight:800; letter-spacing:.05em; color:var(--purple); }
  .cv-cl .ct{ font-weight:800; font-size:calc(15px*var(--scale)); color:var(--ink); margin:2px 0 5px; }

<script>

  const MY_BUILD = document.querySelector('meta[name="app-build"]')?.content || '';
  let _checking = false;
  async function fetchServerBuild(){
    const u = location.pathname + '?_v=' + Date.now();
    try{
      const r = await fetch(u, { cache:'no-store' });
      const t = await r.text();
      const m = t.match(/name="app-build"\s+content="([^"]+)"/);
      if(m) return m[1];
    }catch(e){}
    return null;
  }
  async function checkUpdate(){
    if(_checking) return false;
    _checking = true;
    try{
      const serverBuild = await fetchServerBuild();
      if(serverBuild && MY_BUILD && serverBuild !== MY_BUILD){
        try{ sessionStorage.setItem('fit_updated','1'); }catch(e){}

        return true;
      }
      return false;
    } finally { _checking = false; }
  }

    if (token){

      // compartido (varias alumnas en el mismo celular) esto evita quedarse con la sesión
      // de otra alumna e impide mostrar la cuenta equivocada.
      $('loading-msg').textContent='Validando tu acceso…';

      // Sesión previa que pudiera estar guardada en este teléfono (de otra alumna).
      let prev = null;
      try{ const r = await sb.auth.getSession(); prev = r.data.session; }catch(e){}

      let j;
      try{
        const r = await fetch('/api/alumna-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
        j = await r.json();
      }catch(e){
        // Falla de red: no tocamos la sesión; que reintente tocando el link de nuevo.
        return showError('No pudimos conectar','Revisa tu internet e intenta de nuevo.');
      }
      if(!j||!j.ok){
        // Token inválido: por seguridad, no dejamos abierta una cuenta que podría no ser la del link.
        if(prev){ try{ await sb.auth.signOut(); }catch(e){} }
        return showError('Acceso no válido','Pídele al estudio que te reenvíe tu link por WhatsApp.');
      }

      // Si ya hay sesión guardada y es de LA MISMA cuenta del link, la reusamos (entra directo).
      const sameUser = prev && prev.user && j.email &&
        String(prev.user.email||'').toLowerCase() === String(j.email).toLowerCase();
      if(sameUser){
        history.replaceState({},'',location.pathname);
        return afterAuth();
      }

      // Es otra alumna (teléfono compartido) o no había sesión: cerramos la previa y entramos con el link.
      if(prev){ try{ await sb.auth.signOut(); }catch(e){} }
      let vr = await sb.auth.verifyOtp({ token_hash:j.token_hash, type:'email' });
      if(vr.error) vr = await sb.auth.verifyOtp({ email:j.email, token:j.email_otp, type:'magiclink' });
      if(vr.error) return showError('No pudimos iniciar tu sesión', vr.error.message);
      history.replaceState({},'',location.pathname);
      return afterAuth();
    }

    // Sin token en la URL (por ejemplo, abierta desde el ícono guardado): usar la sesión persistida.
    const { data:{ session } } = await sb.auth.getSession();
    if (session) return afterAuth();
    showError('Bienvenida','Abre el link que te enviamos por WhatsApp para entrar a tu cuenta.');
  }

      const inst={}; (insR.data||[]).forEach(i=>inst[i.id]=i.first_name);

      DATA.bookings = bkR.data||[];

        (sess||[]).forEach(s=>sessById[s.id]=s);

  // Tiempo real: si el estudio marca/cambia su asistencia o reserva, la app se actualiza sola
  let _stuRtChannel = null, _stuRtTimer = null;
  function subscribeStudentRealtime(){
    if(_stuRtChannel || !sb || !DATA.me) return;
    const sid = DATA.me.id;
    try{
      _stuRtChannel = sb.channel('rt-alumna-'+sid)
        .on('postgres_changes', { event:'*', schema:'public', table:'attendance', filter:'student_id=eq.'+sid }, _stuRtRefresh)
        .on('postgres_changes', { event:'*', schema:'public', table:'session_bookings', filter:'student_id=eq.'+sid }, _stuRtRefresh)
        .subscribe();
    }catch(e){}
  }
  function _stuRtRefresh(){ clearTimeout(_stuRtTimer); _stuRtTimer = setTimeout(()=>{ if(appReady) refresh(true); }, 700); }

  function skeletonHTML(){
    return `<div class="sk sk-line" style="width:42%"></div><div class="sk sk-lg"></div>`

  async function refresh(silent){
    const btn = $('refresh-btn'); if(btn) btn.classList.add('spin');
    if(await checkUpdate()) return;
    if(!silent){ $('tab-clases').innerHTML = skeletonHTML(); $('tab-pkg').innerHTML = skeletonHTML(); }
    const tasks = [fetchAll()];
    if(!silent) tasks.push(new Promise(r=>setTimeout(r,450)));

  function isUpcoming(sess, att){
    if(!sess || sess.is_cancelled) return false;
    if(att && ['attended','lost','no_show','recoverable','rescheduled'].includes(att.status)) return false;
    const now = new Date();
    const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    if(sess.session_date>todayIso) return true;
    if(sess.session_date<todayIso) return false;
    return sess.hour >= now.getHours();
  }

  function classStartMs(s){ return new Date(`${s.session_date}T${String(s.hour).padStart(2,'0')}:00:00`).getTime(); }
  const CLASS_DUR_MS = 60*60*1000;          // duración aproximada de la clase
  const CARD_BUFFER_MS = 2*60*60*1000;      // sigue visible hasta 2h DESPUÉS de terminar
  const CLASS_ACTIVE_MS = CLASS_DUR_MS + CARD_BUFFER_MS;  // futura/en curso/post-clase
  function cardStatusBox(status){
    if(status==='attended')    return {cls:'ok',    label:'Asististe',          note:'El estudio registró tu asistencia a esta clase.'};
    if(status==='recoverable') return {cls:'rec',   label:'Falta recuperable',  note:'Esta clase quedó como recuperable. Coordina con tu coordinadora para recuperarla.'};
    if(status==='rescheduled') return {cls:'repro', label:'Reprogramada',       note:'Esta clase se movió a otra fecha.'};
    if(status==='lost'||status==='no_show') return {cls:'lost', label:'Falta registrada', note:'El estudio registró que no asististe a esta clase.'};
    return {cls:'ok', label:'Registrada', note:''};
  }

  const CL = { view:'lista', weekStart:null, mesY:null, mesM:null, sel:null };
  let CLE = { upcoming:[], events:[], next:null };
  function fmtHourClean(h){ const ap=h<12?'am':'pm'; let hh=h%12; if(hh===0)hh=12; return `${hh} ${ap}`; }
  function clTodayIso(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
  function clMondayOf(i){ const d=dObj(i); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }
  function clIso(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  function clOnDate(di){ return CLE.events.filter(e=>e.date===di).sort((a,b)=>a.hour-b.hour); }

  // ── Calificación de clase (tarjeta en inicio) ──────────────────────
  // Solo la ÚLTIMA clase asistida (últimos 7 días), sin calificar y no descartada.
  // Al tocar una estrella aparecen el comentario opcional y Enviar; sin estrella,
  // solo "Ahora no". Guarda vía RPC student_rate_class (valida asistencia real).
  const RATE = { sid:null, val:0 };
  // Estrellitas inline (tamaño de la mayúscula del texto) + "Calificado hace…"
  const _miniStars = (n)=>{ let s=''; for(let i=1;i<=5;i++){ s+=`<svg viewBox="0 0 24 24" style="fill:${i<=n?'#F0B429':'none'};stroke:${i<=n?'#F0B429':'#C9BFD6'}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`; } return `<span class="mini-stars">${s}</span>`; };
  const _ratedWhen = (iso)=>{
    if(!iso) return '';
    const mins = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
    if(mins < 60) return 'hace un momento';
    if(mins < 24*60) { const hh=Math.floor(mins/60); return `hace ${hh} ${hh===1?'hora':'horas'}`; }
    return 'el ' + dayShort(iso.slice(0,10));
  };
  function _rateSkipKey(sid){ return 'fit_rate_skip_'+sid; }
  function rateHomeCard(){
    try{
      const att = (DATA.attendance||[]).filter(a=>a.status==='attended' && DATA.sessById[a.session_id]);
      if(!att.length) return '';
      att.sort((a,b)=>{ const sa=DATA.sessById[a.session_id], sb2=DATA.sessById[b.session_id]; return sb2.session_date.localeCompare(sa.session_date) || sb2.hour-sa.hour; });
      const s = DATA.sessById[att[0].session_id];
      if((DATA.ratings||{})[s.id]) return '';
      try{ if(localStorage.getItem(_rateSkipKey(s.id))) return ''; }catch(e){}
      const ageDays = (Date.now() - new Date(s.session_date+'T00:00:00').getTime()) / 86400000;
      if(ageDays > 7) return '';
      RATE.sid = s.id; RATE.val = 0;
      const star = (n)=>`<button type="button" id="rc-star-${n}" onclick="rateStar(${n})" aria-label="${n} ${n===1?'estrella':'estrellas'}"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>`;
      return `<div class="rate-card" id="rate-card">
        <div class="rc-t">Tu clase con <em>${esc(DATA.inst[s.instructor_id]||'tu profesor')}</em></div>
        <div class="rc-s">${dayFull(s.session_date)} · ${fmtHour(s.hour)}</div>
        <div class="rc-stars">${star(1)}${star(2)}${star(3)}${star(4)}${star(5)}</div>
        <div class="rc-more" id="rc-more" style="display:none">
          <textarea id="rc-comment" maxlength="500" placeholder="¿Quieres contarnos algo? (opcional)"></textarea>
          <button class="btn" id="rc-send" onclick="rateSend()">Enviar</button>
        </div>
        <div class="rc-skip" onclick="rateSkip()">Ahora no</div>
      </div>`;
    }catch(e){ return ''; }
  }
  window.rateStar=(n)=>{
    RATE.val = n;
    for(let i=1;i<=5;i++){ const b=$('rc-star-'+i); if(b) b.classList.toggle('on', i<=n); }
    const m=$('rc-more'); if(m) m.style.display='';
  };
  window.rateSend=async()=>{
    if(!RATE.sid || !RATE.val){ toast('Toca las estrellas para calificar'); return; }
    const btn=$('rc-send'); if(btn){ btn.disabled=true; btn.textContent='Enviando…'; }
    try{
      const { error } = await sb.rpc('student_rate_class', { p_session_id: RATE.sid, p_rating: RATE.val, p_comment: ($('rc-comment')?.value||'') });
      if(error) throw error;
      DATA.ratings = DATA.ratings||{}; DATA.ratings[RATE.sid]={rating:RATE.val, created_at:new Date().toISOString()};
      try{ renderPaquete(); }catch(e){}
      const card=$('rate-card');
      if(card){ card.innerHTML = `<div class="rc-thanks">✓ ¡Gracias por tu calificación!</div>`; setTimeout(()=>{ card.style.display='none'; }, 2200); }
    }catch(e){ toast('No se pudo enviar. Intenta de nuevo.'); if(btn){ btn.disabled=false; btn.textContent='Enviar'; } }
  };
  // ── Registro de adopción de la app (solo primera vez, dedupe en servidor) ──
  // iOS no avisa cuándo la agregan al inicio, pero sí podemos detectar cuando la
  // ABREN desde el ícono (modo standalone) — que es la señal de adopción real.
  function logAppAdoption(){
    try{
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if(standalone && !localStorage.getItem('fit_app_standalone_logged')){
        sb.rpc('student_log_app_event', { p_type: 'app_inicio_standalone' }).then(()=>{
          try{ localStorage.setItem('fit_app_standalone_logged','1'); }catch(e){}
        });
      }
    }catch(e){}
  }
  // Android/Chrome sí dispara un evento oficial al instalarla
  window.addEventListener('appinstalled', ()=>{ try{ sb.rpc('student_log_app_event', { p_type: 'app_instalada' }); }catch(e){} });

  window.rateSkip=()=>{
    try{ if(RATE.sid) localStorage.setItem(_rateSkipKey(RATE.sid),'1'); }catch(e){}
    const card=$('rate-card'); if(card) card.style.display='none';
  };

  function renderClases(){
    const now = Date.now();
    const attBySession={}; DATA.attendance.forEach(a=>{ attBySession[a.session_id]=a; });
    const events=[];
    DATA.bookings.forEach(b=>{
      if(b.cancelled_at) return;
      const s=DATA.sessById[b.session_id]; if(!s||s.is_cancelled) return;
      const start=classStartMs(s);
      if(now - start >= CLASS_ACTIVE_MS) return;   // ya pasó (más de 2h tras terminar) → al historial vía asistencia
      const att=attBySession[b.session_id];
      events.push({ date:s.session_date, hour:s.hour, loc:s.location_id, inst:s.instructor_id, sid:s.id, kind:'up', bid:b.id, conf:b.confirmed_at, cancel:b.cancel_requested_at, status: att?att.status:null, start });
    });
    DATA.attendance.forEach(a=>{
      const s=DATA.sessById[a.session_id]; if(!s) return;
      const start=classStartMs(s);
      if(now - start < CLASS_ACTIVE_MS) return;    // aún vigente → ya está como 'up' (evita duplicado)
      events.push({ date:s.session_date, hour:s.hour, loc:s.location_id, inst:s.instructor_id, sid:s.id, kind:'att', status:a.status, start });
    });
    const upcoming = events.filter(e=>e.kind==='up').sort((a,b)=> a.start-b.start);
    CLE = { upcoming, events, next: upcoming[0]||null };
    if(CL.sel==null) CL.sel = clTodayIso();

    const el=$('tab-clases');
    if(events.length===0){
      $('app-body')?.classList.remove('cal');
      const livePkgs = (DATA.packages||[]).filter(p => !p.is_frozen && (!p.status||p.status==='active') && (p.classes_used||0) < (p.classes_total||0));
      const remaining = livePkgs.reduce((s,p)=> s + Math.max(0,(p.classes_total||0)-(p.classes_used||0)), 0);
      if(remaining > 0){
        el.innerHTML = `<div class="eyebrow">Mis clases</div><div class="accent"></div>${lnHomeBanner()}${rateHomeCard()}
          <div class="empty">Todavía no tienes clases agendadas. Tienes <b>${remaining} ${remaining===1?'clase disponible':'clases disponibles'}</b> en tu paquete: agenda tu primera clase o espera a que el estudio te agende.</div>
          <button class="packbtn" onclick="openDatePicker('add', null)">
            <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
            <span class="ptx"><span class="pt">Agregar una clase</span><span class="ps">Tienes ${remaining} ${remaining===1?'clase disponible':'clases disponibles'}</span></span>
            <span class="parr">&rsaquo;</span></button>`;
      } else {
        el.innerHTML = `<div class="eyebrow">Mis clases</div><div class="accent"></div>${lnHomeBanner()}${rateHomeCard()}
          <div class="empty">No tienes clases agendadas. Cuando el estudio te agende una, aparecerá aquí.</div>`;
      }
      return;
    }
    const next = CLE.next;
    let html = `<div id="cl-top"><div class="eyebrow">Mis clases</div><div class="accent"></div>${lnHomeBanner()}${rateHomeCard()}`;
    if(next){
      const start = next.start, started = start <= now, ended = now >= start + CLASS_DUR_MS;
      html += `<div class="px-lab">${started ? 'Tu clase de hoy' : 'Tu próxima clase'}</div>
        <div class="next-day">${dayFull(next.date)}</div>
        <div class="next-time">${fmtHour(next.hour)}</div>
        <div class="next-rows">
          <div class="r"><span class="lab">Profesor</span><span class="val">${esc(DATA.inst[next.inst]||'—')}</span></div>
          <div class="r"><span class="lab">Sede</span><span class="val">${esc(DATA.locs[next.loc]||'—')}</span></div>
        </div>`;
      if(next.status){
        const sbx = cardStatusBox(next.status);
        html += `<div class="sbox ${sbx.cls}">${sbx.label}</div>${sbx.note?`<div class="micro">${sbx.note}</div>`:''}`;
      } else if(!started){
        const hrsNext = (start - now) / 3600000;
        // El enlace gris "No podré ir a esta clase" está SIEMPRE (abre el sheet de aviso).
        // "Cambiar mi clase" se suma encima solo cuando faltan 4h o más.
        const changeOrAbsent = (hrsNext >= 4
          ? `<button class="btn ghost" style="margin-top:10px" onclick="openChangeSheet('${next.bid}')">Cambiar mi clase</button>`
          : '') + `<button class="linkbtn" onclick="openClassSheet('${next.bid}')">No podré ir a esta clase</button>`;
        if(next.cancel){
          html += `<div class="sbox aviso">Avisaste que no vendrás</div>
            <div class="micro">La coordinadora se pondrá en contacto contigo.</div>
            <button class="btn ghost" style="margin-top:12px" onclick="confirmar('${next.bid}', false)">Sí voy a venir</button>`;
        } else if(next.conf){
          html += `<button class="btn confirmed" id="confbtn" onclick="confirmar('${next.bid}', true)">Asistencia confirmada</button>
            ${changeOrAbsent}`;
        } else {
          html += `<button class="btn" id="confbtn" onclick="confirmar('${next.bid}', false)">Confirmar mi asistencia</button>
            ${changeOrAbsent}`;
        }
      } else if(!ended){
        html += (next.conf
          ? `<div class="sbox ok">Asistencia confirmada</div><div class="micro">Tu clase está en curso. El estudio registrará tu asistencia al terminar.</div>`
          : `<div class="sbox neutral">Clase en curso</div><div class="micro">Tu clase está en curso.</div>`);
      } else {
        html += `<div class="sbox neutral">Clase terminada</div><div class="micro">El estudio registrará tu asistencia pronto.</div>`;
      }
    } else {
      html += `<div class="empty">No tienes una próxima clase agendada por ahora.</div>`;
    }
    let bulkBtn = '';
    {
      const future = upcoming.filter(e => e.bid && !e.status && e.start > now);
      const total = future.length;
      if(total >= 2){
        const confCount = future.filter(e => e.conf).length;
        if(confCount === 0){
          bulkBtn = `<button class="packbtn" onclick="openPackSheet()">
            <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
            <span class="ptx"><span class="pt">Confirmar mis ${total} clases</span><span class="ps">Revisa y confirma todas de una vez</span></span>
            <span class="parr">&rsaquo;</span></button>`;
        } else {
          bulkBtn = `<button class="packbtn some" onclick="openPackSheet()">
            <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span class="ptx"><span class="pt">${confCount} de ${total} clases confirmadas</span><span class="ps">Toca para gestionar o avisar ausencias</span></span>
            <span class="parr">&rsaquo;</span></button>`;
        }
      }
    }
    let addBtn = '';
    {
      const livePkgs = (DATA.packages||[]).filter(p => !p.is_frozen && (!p.status||p.status==='active') && (p.classes_used||0) < (p.classes_total||0));
      if(livePkgs.length){
        const maxCred = livePkgs.reduce((s,p)=> s + Math.max(0,(p.classes_total||0)-(p.classes_used||0)), 0);
        const futureBk = upcoming.filter(e => e.bid && !e.status && e.start > now).length;
        const remaining = Math.max(0, maxCred - futureBk);
        const sub = remaining > 0 ? `Tienes ${remaining} ${remaining===1?'clase disponible':'clases disponibles'}` : 'Compra un paquete para agregar';

  window.clShiftMes=(n)=>{ CL.mesM+=n; if(CL.mesM<0){CL.mesM=11;CL.mesY--;} if(CL.mesM>11){CL.mesM=0;CL.mesY++;} renderClasesView(); };

  function fitMonth(){
    if(CL.view!=='mes') return;
    const body=$('app-body'), view=$('clases-view'); if(!body||!view) return;
    const grid=view.querySelector('.grid'); if(!grid) return;
    const seg=document.querySelector('#tab-clases .seg');
    const calnav=view.querySelector('.cal-nav');
    const dow=view.querySelector('.dow');
    const avail=body.clientHeight;
    const overhead=(seg?seg.offsetHeight+18:0)+(calnav?calnav.offsetHeight+16:0)+(dow?dow.offsetHeight+8:0)+24;
    const r=Math.ceil(grid.children.length/7) || 6;
    let cellH=Math.floor((avail-overhead-150)/r);
    cellH=Math.max(34, Math.min(cellH, 62));
    const circ=Math.max(26, Math.min(cellH-12, 40));
    grid.style.setProperty('--cellH', cellH+'px');
    grid.style.setProperty('--circ', circ+'px');
  }

  function clLista(){
    const rest = CLE.next ? CLE.upcoming.slice(1) : CLE.upcoming;

    const now=Date.now();
    rest.forEach((e,i)=>{
      let pill='';

        if(e.cancel) pill=`<button class="pill aviso" onclick="openClassSheet('${e.bid}')">Avisaste que no irás</button>`;

        else pill=`<button class="pill todo" onclick="openClassSheet('${e.bid}')">Por confirmar</button>`;
      } else if(e.status){
        const sc=stateChip(e.status); pill=`<span class="pill ${sc[0]}">${sc[1]}</span>`;
      }
      h+=`<div class="row${i===0?' first':''}"><div class="when"><div class="d">${dayFull(e.date)}</div><div class="s">${fmtHour(e.hour)} · ${esc(DATA.locs[e.loc]||'—')} · con ${esc(DATA.inst[e.inst]||'—')}</div></div>${pill}</div>`;

  function clSemana(){
    if(!CL.weekStart) CL.weekStart=clMondayOf(clTodayIso());
    const ws=CL.weekStart, end=new Date(ws); end.setDate(end.getDate()+6);
    const today=clTodayIso();

    let cells='';
    for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); const di=clIso(d.getFullYear(),d.getMonth(),d.getDate()); const cs=clOnDate(di);

      const hr= cs.length ? `<span class="wk-hr" style="color:${DATA.locColor[cs[0].loc]||'#5B2A8F'}">${fmtHourClean(cs[0].hour)}</span>` : `<span class="wk-hr"></span>`;
      cells+=`<button class="${cls.join(' ')}" onclick="clPick('${di}')"><span class="wd">${DOW[i]}</span><span class="ncirc"><span class="cnum">${d.getDate()}</span></span>${hr}</button>`;

    return `<div class="cal-nav"><button onclick="clShiftWeek(-1)">‹</button><div class="cal-ttl">${ttl}</div><button onclick="clShiftWeek(1)">›</button></div><div class="week">${cells}</div>${clDetail()}`;

  function clMes(){
    if(CL.mesY==null){ const t=dObj(clTodayIso()); CL.mesY=t.getFullYear(); CL.mesM=t.getMonth(); }
    const today=clTodayIso();
    const lead=(new Date(CL.mesY,CL.mesM,1).getDay()+6)%7, days=new Date(CL.mesY,CL.mesM+1,0).getDate();

  function renderPaquete(){
    const el=$('tab-pkg');
    const valid = DATA.packages.filter(p=> p.status!=='changed' && !p.closed_at);
    const isDone = (p)=> (p.classes_used||0) >= (p.classes_total||0);
    const asc = [...valid].sort((a,b)=>(a.purchase_date||'').localeCompare(b.purchase_date||'') || (a.start_date||'').localeCompare(b.start_date||''));
    // entre los no completados, el ACTIVO es el que ya empezó (tiene clases tomadas); si ninguno empezó, el más antiguo
    const candidates = asc.filter(p=> !p.is_frozen && !isDone(p));
    const active = candidates.find(p=> (p.classes_used||0) > 0) || candidates[0];
    const pname = (p)=> DATA.pkgNames[p.package_id] || 'Paquete';

    if(valid.length===0){
      el.innerHTML = `<div class="eyebrow">Mi paquete</div><div class="accent"></div>
        <div class="empty">Aún no tienes un paquete activo. Cuando compres uno, aquí verás cuántas clases te quedan.</div>`;
      return;
    }

    let html = `<div class="eyebrow">Tu paquete actual</div><div class="accent"></div>`;
    if(active){
      const total=active.classes_total||0, used=active.classes_used||0, remain=Math.max(0,total-used);
      let segs=''; for(let i=0;i<total;i++) segs+=`<div class="seg${i<used?' used':''}"></div>`;
      html += `<div class="pkg-num">${remain}</div><div class="pkg-word">clases te quedan</div>
        <div class="pkg-bar" style="grid-template-columns:repeat(${Math.min(total,10)||1},1fr)">${segs}</div>
        <div class="pkg-info"><b>${esc(pname(active))}</b>${active.purchase_date?` · adquirido el <b>${dayShort(active.purchase_date)}</b>`:''}</div>`;
    } else {
      html += `<div class="empty">No tienes un paquete con clases disponibles ahora mismo.</div>`;
    }

    const attBySession={}; DATA.attendance.forEach(a=>{ if(a.session_id) attBySession[a.session_id]=a; });
    const upcoming = DATA.bookings
      .map(b=>({ b, s:DATA.sessById[b.session_id] }))
      .filter(x=> x.s && !x.b.cancelled_at && isUpcoming(x.s, attBySession[x.b.session_id]))
      .map(x=>x.s);

    // la clase realmente "próxima" es la más cercana en fecha+hora (solo esa lleva el tag Próxima)
    const nextId = (upcoming.slice().sort((a,b)=> a.session_date.localeCompare(b.session_date) || a.hour-b.hour)[0]||{}).id;

    const rowsByPkg={};
    const activeId = active?.id;
    DATA.attendance.forEach(a=>{ const s=DATA.sessById[a.session_id]; if(!s) return; const pid=a.student_package_id||activeId; if(!pid) return; (rowsByPkg[pid]=rowsByPkg[pid]||[]).push({ s, att:a }); });
    if(activeId) upcoming.forEach(s=>{ (rowsByPkg[activeId]=rowsByPkg[activeId]||[]).push({ s, prox:true }); });

    const lastDate = (pid)=>{ let m=''; (rowsByPkg[pid]||[]).forEach(r=>{ if(r.s.session_date>m) m=r.s.session_date; }); return m; };
    const others = valid.filter(p=> p.id!==activeId);
    const proximos = others.filter(p=> !isDone(p)).sort((a,b)=>(a.purchase_date||'').localeCompare(b.purchase_date||''));
    const anteriores = others.filter(p=> isDone(p)).sort((a,b)=>{ const da=lastDate(a.id)||a.purchase_date||'', db=lastDate(b.id)||b.purchase_date||''; return db.localeCompare(da); });
    const order = [activeId, ...proximos.map(p=>p.id), ...anteriores.map(p=>p.id)].filter(Boolean);

    order.forEach(pid=>{
      const p = valid.find(x=>x.id===pid); if(!p) return;
      const all = rowsByPkg[pid]||[];
      const ups = all.filter(r=>r.prox).sort((a,b)=> a.s.session_date.localeCompare(b.s.session_date) || a.s.hour-b.s.hour);
      const dones = all.filter(r=>!r.prox).sort((a,b)=> b.s.session_date.localeCompare(a.s.session_date) || b.s.hour-a.s.hour);
      const rows = [...ups, ...dones];
      const total=p.classes_total||0, used=p.classes_used||0, remain=Math.max(0,total-used);
      let label, sub;
      if(pid===activeId){ label='Paquete actual'; sub=`${total} clases · ${used} tomadas · ${remain} te quedan`; }
      else if(!isDone(p)){ label='Paquete próximo'; sub=`${total} clases · empieza cuando termines el actual`; }
      else { label='Paquete anterior'; sub=`${total} clases · completado`; }
      const open = (pid===activeId);
      html += `<div class="pkg-card${open?' open':''}${pid===activeId?' is-active':''}" id="card-${pid}">`;
      html += `<div class="pkg-head${open?' open':''}" role="button" tabindex="0" onclick="togglePkg('${pid}', this)"><div class="pkg-head-txt"><div class="group-h">${label}</div><div class="group-sub" style="margin-bottom:0;">${sub}</div></div><span class="pkg-chev-wrap"><svg class="pkg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div>`;
      html += `<div class="pkg-body${open?'':' collapsed'}" id="body-${pid}">`;
      if(rows.length===0){ html+=`<div class="empty">Sin clases registradas todavía.</div>`; }
      rows.forEach((r,i)=>{
        let cls,label2;
        if(r.prox){ if(r.s.id===nextId){ cls='prox'; label2='Próxima'; } else { cls='sched'; label2='Agendada'; } }
        else { [cls,label2]=stateChip(r.att.status); }
        const rt = !r.prox ? (DATA.ratings||{})[r.s.id] : null;
        const starsBit = rt ? ' ' + _miniStars(rt.rating) : '';
        const ratedNote = rt ? `<div class="rated-note">Calificado ${_ratedWhen(rt.created_at)}</div>` : '';
        html += `<div class="row${i===0?' first':''}"><div class="when"><div class="d">${dayFull(r.s.session_date)}</div><div class="s">${fmtHour(r.s.hour)} · ${esc(DATA.locs[r.s.location_id]||'—')} · con ${esc(DATA.inst[r.s.instructor_id]||'—')}${starsBit}</div>${ratedNote}</div><span class="chk ${cls}">${label2}</span></div>`;
      });
      html += `</div></div>`;
    });

    html += `<div class="legend"><span><i class="pp"></i> Próxima</span><span><i class="ag"></i> Agendada</span><span><i class="g"></i> Asististe</span><span><i class="gd"></i> Recuperable</span><span><i class="b"></i> Reprogramada</span><span><i class="r"></i> Perdida</span></div>`;
    el.innerHTML = html;
  }

  const PH_CODES=[['+51','🇵🇪 +51'],['+1','🇺🇸 +1'],['+34','🇪🇸 +34'],['+52','🇲🇽 +52'],['+54','🇦🇷 +54'],['+55','🇧🇷 +55'],['+56','🇨🇱 +56'],['+57','🇨🇴 +57'],['+58','🇻🇪 +58'],['+593','🇪🇨 +593'],['+591','🇧🇴 +591']];
  function parsePhone(raw){
    const s=String(raw||'').trim();
    if(!s) return { code:'+51', num:'' };
    const clean=s.replace(/[\s\-().]/g,'');
    if(clean.startsWith('+')){
      const codes=PH_CODES.map(c=>c[0]).sort((a,b)=>b.length-a.length);
      for(const c of codes){ if(clean.startsWith(c)) return { code:c, num:clean.slice(c.length) }; }
      const m=clean.match(/^(\+\d{1,3})(\d+)$/); if(m) return { code:m[1], num:m[2] };
    }
    return { code:'+51', num:clean };
  }

      ${consent}
      <div class="pf-sec">Lineamientos</div>
      <button class="pf-lnalert" onclick="openLineamientos()" style="margin-top:0"><span class="pic">${icBook}</span><div><div class="t1">Lee nuestros lineamientos</div><div class="t2">Lo que hace que tus clases fluyan mejor</div></div><span class="chev">›</span></button>
      <div class="pf-sec">Más datos</div>
      <button class="pf-disc ${PF.moreOpen?'open':''}" id="pf-more-toggle" onclick="pfToggleMore()"><span class="pic">${icUser}</span><div><div style="font-weight:700;color:var(--ink)">Ver y editar mis datos</div><div style="font-size:12px;color:var(--ink-mute)">Correo, documento, nacimiento, emergencia</div></div><span class="chev">›</span></button>
      <div class="pf-more" id="pf-more" style="display:${PF.moreOpen?'block':'none'}">
        <div class="pf-field"><label class="pf-lab">Correo</label><input class="pf-in" id="pf-email" type="email" value="${esc(p.email||'')}" placeholder="tucorreo@ejemplo.com" oninput="pfClearErr('pf-email')"><div class="pf-err" id="err-pf-email"></div></div>
        <div class="pf-field"><label class="pf-lab">Teléfono</label><div class="pf-phrow">${phSelect('pf-phone-code',mainPh.code)}<input class="pf-in" id="pf-phone" type="tel" inputmode="numeric" value="${esc(mainPh.num)}" placeholder="987 654 321" oninput="pfClearErr('pf-phone')"></div><div class="pf-err" id="err-pf-phone"></div></div>
        <div class="pf-field"><label class="pf-lab">Género</label><select class="pf-in" id="pf-gender">${opt('','—',p.gender)}${opt('F','Femenino',p.gender)}${opt('M','Masculino',p.gender)}${opt('O','Otro',p.gender)}</select></div>
        <div class="pf-row">
          <div class="pf-field"><label class="pf-lab">Documento</label><select class="pf-in" id="pf-doctype" onchange="pfClearErr('pf-docnum')">${opt('','—',p.document_type)}${opt('DNI','DNI',p.document_type)}${opt('CE','C. Extranjería',p.document_type)}${opt('Pasaporte','Pasaporte',p.document_type)}</select></div>
          <div class="pf-field"><label class="pf-lab">Número</label><input class="pf-in" id="pf-docnum" value="${esc(p.document_number||'')}" oninput="pfClearErr('pf-docnum')"></div>
        </div>
        <div class="pf-err" id="err-pf-docnum" style="margin-top:-6px"></div>
        <div class="pf-field"><label class="pf-lab">Fecha de nacimiento</label><button type="button" class="pf-dateBtn ${PF.birth?'':'empty'}" id="pf-birthbtn" onclick="openBirthPicker()">${birthLabel}</button></div>
        <div class="pf-field"><label class="pf-lab">Contacto de emergencia</label><input class="pf-in" id="pf-emname" value="${esc(p.emergency_contact_name||'')}" placeholder="Nombre"></div>
        <div class="pf-field"><label class="pf-lab">Teléfono de emergencia</label><div class="pf-phrow">${phSelect('pf-emphone-code',emPh.code)}<input class="pf-in" id="pf-emphone" type="tel" inputmode="numeric" value="${esc(emPh.num)}" placeholder="987 654 321" oninput="pfClearErr('pf-emphone')"></div><div class="pf-err" id="err-pf-emphone"></div></div>
        <button class="btn" id="pf-save" onclick="saveProfile()" style="margin-top:16px">Guardar cambios</button>
      </div>`;
  }
  window.pfClearErr=(id)=>{ const el=$(id); if(el) el.classList.remove('err'); const er=$('err-'+id); if(er){ er.classList.remove('show'); er.textContent=''; } };
  function pfSetErr(id,msg){ const el=$(id); if(el) el.classList.add('err'); const er=$('err-'+id); if(er){ er.textContent=msg; er.classList.add('show'); } }
  window.pfToggleMore=()=>{ PF.moreOpen=!PF.moreOpen; const m=$('pf-more'); const t=$('pf-more-toggle'); if(m) m.style.display=PF.moreOpen?'block':'none'; if(t) t.classList.toggle('open',PF.moreOpen); };

  window.saveProfile = async ()=>{
    const val=id=>{ const el=$(id); return (el && String(el.value).trim()!=='') ? String(el.value).trim() : null; };
    // validaciones (bloquean el guardado si algo está mal)
    let ok=true, firstErr=null;
    const fail=(id,msg)=>{ pfSetErr(id,msg); ok=false; if(!firstErr) firstErr=id; };
    const email=val('pf-email');
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) fail('pf-email','Escribe un correo válido (ej. nombre@correo.com)');
    const phNum=(val('pf-phone')||'').replace(/\D/g,'');
    if(val('pf-phone') && (phNum.length<6 || phNum.length>15)) fail('pf-phone','El teléfono debe tener entre 6 y 15 números');
    const emNum=(val('pf-emphone')||'').replace(/\D/g,'');
    if(val('pf-emphone') && (emNum.length<6 || emNum.length>15)) fail('pf-emphone','El teléfono debe tener entre 6 y 15 números');
    const dt=val('pf-doctype'), dn=val('pf-docnum');
    if(dn){
      if(dt==='DNI' && !/^\d{8}$/.test(dn)) fail('pf-docnum','El DNI son 8 números exactos');
      else if(dt==='CE' && !/^[A-Za-z0-9]{6,15}$/.test(dn)) fail('pf-docnum','El C.E. son 6 a 15 letras y números');
      else if(dt==='Pasaporte' && dn.length<4) fail('pf-docnum','Revisa el número de pasaporte');
      else if(!dt) fail('pf-docnum','Elige primero el tipo de documento');
    }
    if(!ok){ const el=$(firstErr); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); toast('Revisa los campos marcados en rojo'); return; }
    // combinar código de país + número
    const phone = phNum ? `${val('pf-phone-code')||'+51'} ${phNum}` : null;
    const emphone = emNum ? `${val('pf-emphone-code')||'+51'} ${emNum}` : null;
    const btn=$('pf-save'); if(btn){ btn.textContent='Guardando…'; btn.disabled=true; }
    try{
      const { error } = await sb.rpc('student_update_profile', {
        p_email: email, p_phone: phone, p_gender: val('pf-gender'),
        p_document_type: dt, p_document_number: dn,
        p_birth_date: PF.birth||null, p_emergency_contact_name: val('pf-emname'),
        p_emergency_contact_phone: emphone
      });
      if(error) throw error;
      const p=PF.p; p.email=email; p.phone=phone; p.gender=val('pf-gender'); p.document_type=dt; p.document_number=dn; p.birth_date=PF.birth; p.emergency_contact_name=val('pf-emname'); p.emergency_contact_phone=emphone;
      const hero=document.querySelector('#pf-screen .pf-hero .ph'); if(hero) hero.textContent=p.phone||'Sin teléfono';
      toast('✓ Perfil actualizado');
      if(btn){
        btn.textContent='✓ Datos guardados'; btn.classList.add('saved'); btn.disabled=false;
        clearTimeout(btn._savedT);
        btn._savedT=setTimeout(()=>{ btn.textContent='Guardar cambios'; btn.classList.remove('saved'); }, 2500);
      }
    }catch(e){ toast('No se pudo guardar. Intenta de nuevo.'); if(btn){ btn.textContent='Guardar cambios'; btn.disabled=false; } }
  };

  // ---- Calendario propio para la fecha de nacimiento (3 pasos: año → mes → día) ----
  function bpFmt(iso){ const d=new Date(iso+'T12:00:00'); return `${d.getDate()} de ${MESES[d.getMonth()]}, ${d.getFullYear()}`; }
  window.openBirthPicker=()=>{
    let ov=$('bp-ov');
    if(!ov){ ov=document.createElement('div'); ov.id='bp-ov'; ov.className='bp-ov'; ov.addEventListener('click',e=>{ if(e.target===ov) closeBirth(); }); document.querySelector('.phone').appendChild(ov); }
    const init = PF.birth ? new Date(PF.birth+'T12:00:00') : new Date(1965,0,1);
    BP={ y:init.getFullYear(), m:init.getMonth(), step:'year' };  // siempre arranca eligiendo el año
    bpRender(); requestAnimationFrame(()=>ov.classList.add('show'));
  };
  window.closeBirth=()=>{ const ov=$('bp-ov'); if(ov) ov.classList.remove('show'); };
  window.bpBack=()=>{ BP.step = BP.step==='day' ? 'month' : 'year'; bpRender(); };
  window.bpPickYear=(y)=>{ BP.y=y; BP.step='month'; bpRender(); };
  window.bpPickMonth=(m)=>{ BP.m=m; BP.step='day'; bpRender(); };
  window.bpPickDay=(d)=>{ const iso=`${BP.y}-${String(BP.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; PF.birth=iso; const b=$('pf-birthbtn'); if(b){ b.textContent=bpFmt(iso); b.classList.remove('empty'); } closeBirth(); };
  function bpRender(){
    const ov=$('bp-ov'); if(!ov) return; let inner;
    const back = BP.step==='year' ? '' : `<button class="bp-backbtn" onclick="bpBack()">‹</button>`;
    if(BP.step==='year'){
      const now=new Date().getFullYear(); let ys='';
      for(let y=now;y>=1930;y--) ys+=`<button class="bp-yr ${y===BP.y?'sel':''}" onclick="bpPickYear(${y})">${y}</button>`;
      inner=`<div class="bp-head"><div><div class="bp-step">Paso 1 de 3</div><div class="bp-title">¿En qué año naciste?</div></div></div><div class="bp-years">${ys}</div>`;
    } else if(BP.step==='month'){
      const ms=MESES.map((mn,i)=>`<button class="bp-mo ${i===BP.m?'sel':''}" onclick="bpPickMonth(${i})">${mn}</button>`).join('');
      inner=`<div class="bp-head">${back}<div><div class="bp-step">Paso 2 de 3 · ${BP.y}</div><div class="bp-title">¿En qué mes?</div></div></div><div class="bp-months">${ms}</div>`;
    } else {
      const first=new Date(BP.y,BP.m,1).getDay();
      const days=new Date(BP.y,BP.m+1,0).getDate();
      const dow=['D','L','M','M','J','V','S'];
      let cells=dow.map(d=>`<div class="bp-dow">${d}</div>`).join('');
      for(let i=0;i<first;i++) cells+=`<button class="bp-day empty"></button>`;
      for(let d=1;d<=days;d++){ const iso=`${BP.y}-${String(BP.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; cells+=`<button class="bp-day ${iso===PF.birth?'sel':''}" onclick="bpPickDay(${d})">${d}</button>`; }
      inner=`<div class="bp-head">${back}<div><div class="bp-step">Paso 3 de 3 · ${MESES[BP.m]} ${BP.y}</div><div class="bp-title">¿Qué día?</div></div></div><div class="bp-grid">${cells}</div>`;
    }
    ov.innerHTML=`<div class="bp-card">${inner}</div>`;
  }

  // ---- Visor de consentimiento ----
  window.openConsent=async ()=>{
    let ov=$('cv-screen');
    if(!ov){ ov=document.createElement('div'); ov.id='cv-screen'; ov.className='cv-screen'; document.querySelector('.phone').appendChild(ov); }
    ov.innerHTML=`<div class="pf-bar"><button class="pf-back" onclick="closeConsent()">‹</button><div class="ttl">Consentimiento</div></div><div class="cv-scroll" id="cv-scroll"><div style="padding:40px 0;text-align:center;color:var(--ink-mute)">Cargando…</div></div>`;
    requestAnimationFrame(()=>ov.classList.add('show'));
    let c;
    try{ const { data } = await sb.from('app_content').select('title,body,plain_text,version').eq('kind','consentimiento').eq('is_active',true).order('updated_at',{ascending:false}).limit(1).maybeSingle(); c=data; }catch(e){}
    if(!c){ const s=$('cv-scroll'); if(s) s.innerHTML='<div style="padding:40px 0;text-align:center;color:var(--ink-mute)">No pudimos cargar el consentimiento.</div>'; return; }
    CV={ text:c.plain_text||'', version:c.version||'v1.0', img:false };
    const clausulas=(c.body&&c.body.clausulas)||[];
    const clHtml=clausulas.map(cl=>`<div class="cv-cl"><div class="cn">${esc(cl.n)}</div><div class="ct">${esc(cl.t)}</div><div class="cd">${esc(cl.d)}</div></div>`).join('');
    ov.innerHTML=`<div class="pf-bar"><button class="pf-back" onclick="closeConsent()">‹</button><div class="ttl">Consentimiento</div></div>
      <div class="cv-scroll" id="cv-scroll"><div style="font-family:var(--display);font-weight:600;font-size:calc(19px*var(--scale));line-height:1.22;margin:6px 0 16px">${esc(c.title||'Consentimiento informado')}</div>${clHtml}<div style="height:4px"></div></div>
      <div class="cv-foot">
        <div class="cv-img" id="cv-img" onclick="cvToggleImg()"><div class="cv-box"></div><div class="cvt">Autorizo el uso de mi imagen (fotos/videos) con fines internos y de difusión del estudio. <b>Opcional</b>.</div></div>
        <button class="btn" id="cv-sign" disabled onclick="cvSign()">Firmar consentimiento</button>
        <div class="cv-hint" id="cv-hint">Desliza hasta el final para habilitar la firma</div>
      </div>`;
    const sc=$('cv-scroll');
    const check=()=>{ if(sc.scrollTop+sc.clientHeight >= sc.scrollHeight-28){ const b=$('cv-sign'); if(b&&b.disabled){ b.disabled=false; const h=$('cv-hint'); if(h) h.textContent='Ya puedes firmar'; } } };
    sc.onscroll=check; requestAnimationFrame(check);
  };
  window.closeConsent=()=>{ const ov=$('cv-screen'); if(ov) ov.classList.remove('show'); };
  window.cvToggleImg=()=>{ CV.img=!CV.img; const el=$('cv-img'); if(el){ el.classList.toggle('on',CV.img); const box=el.querySelector('.cv-box'); if(box) box.innerHTML=CV.img?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''; } };
  window.cvSign=async ()=>{
    const b=$('cv-sign'); if(b){ b.textContent='Firmando…'; b.disabled=true; }
    try{
      const { error } = await sb.rpc('student_sign_consent', { p_full_consent_text:CV.text, p_consent_version:CV.version, p_user_agent:navigator.userAgent, p_image_consent:!!CV.img });
      if(error) throw error;
      if(PF.p){ PF.p.consent_signed_at=new Date().toISOString(); PF.p.image_consent=!!CV.img; }
      toast('✓ Consentimiento firmado');
      window.closeConsent(); if(PF.p) renderProfile();
    }catch(e){ toast('No se pudo firmar. Intenta de nuevo.'); if(b){ b.textContent='Firmar consentimiento'; b.disabled=false; } }
  };

  // ---- Lineamientos (banner en inicio + pantallas deslizables) ----
  let LN = { screens:[], title:'', i:0, loaded:false };
  const LN_ICONS = {
    prep:    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 3.6 6.6 5 10l3-1v11h8V9l3 1 1.4-3.4L16 4a4 4 0 0 1-8 0z"/></svg>',
    clock:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    health:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3.4 1-4.5 2.5A5.6 5.6 0 0 0 7.5 3 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg>',
    chat:    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    hours:   '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
    cancel:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
    validity:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 5-5"/></svg>',
    silence: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/><path d="M4 4 20 20"/></svg>',
    done:    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
  };
  function lnHomeBanner(){
    const me=DATA.me||{};
    if(me.lineamientos_ack_at) return '';   // ya los revisó todos → nunca más en inicio
    const icBook='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
    if(me.lineamientos_opened_at)
      return `<button class="ln-banner half" onclick="openLineamientos()"><span class="pic">${icBook}</span><div><div class="t1">Te faltan lineamientos por leer</div><div class="t2">Revísalos todos para que este mensaje desaparezca</div></div><span class="chev">›</span></button>`;
    return `<button class="ln-banner new" onclick="openLineamientos()"><span class="pic">${icBook}</span><div><div class="t1">Conoce nuestros lineamientos</div><div class="t2">2 minutos · lo que hace que tus clases fluyan mejor</div></div><span class="chev">›</span></button>`;
  }
  window.openLineamientos=async ()=>{
    let ov=$('ln-screen');
    if(!ov){ ov=document.createElement('div'); ov.id='ln-screen'; ov.className='ln-screen'; document.querySelector('.phone').appendChild(ov); }
    ov.innerHTML=`<div class="pf-bar"><button class="pf-back" onclick="closeLineamientos()">‹</button><div class="ttl">Lineamientos</div></div><div class="ln-body"><div style="color:var(--ink-mute)">Cargando…</div></div>`;
    requestAnimationFrame(()=>ov.classList.add('show'));
    if(!LN.loaded){
      try{
        const { data } = await sb.from('app_content').select('title,body').eq('kind','lineamientos').eq('is_active',true).order('updated_at',{ascending:false}).limit(1).maybeSingle();
        if(data){ LN.screens=(data.body&&data.body.screens)||[]; LN.title=data.title||'Lineamientos'; LN.loaded=true; }
      }catch(e){}
    }
    if(!LN.screens.length){ const b=ov.querySelector('.ln-body'); if(b) b.innerHTML='<div style="color:var(--ink-mute)">No pudimos cargar los lineamientos. Intenta de nuevo.</div>'; return; }
    LN.i=0; lnRender();

    if(DATA.me && !DATA.me.lineamientos_opened_at){

  window.lnFinish=async ()=>{

    if(DATA.me){ DATA.me.lineamientos_ack_at=new Date().toISOString(); if(!DATA.me.lineamientos_opened_at) DATA.me.lineamientos_opened_at=DATA.me.lineamientos_ack_at; }

  function lnRender(){

      // pantalla final
      ov.innerHTML=`<div class="pf-bar"><button class="pf-back" onclick="lnBack()">‹</button><div class="ttl">Lineamientos</div></div>
        <div class="ln-body"><div class="ln-ic done">${LN_ICONS.done}</div><div class="ln-ttl">¡Listo!</div><div class="ln-txt">Ya conoces nuestros lineamientos. Están siempre en tu perfil por si quieres releerlos.</div></div>

      </div>
