<!DOCTYPE html>
<html lang="es" data-size="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FIT Studio · Mi cuenta</title>
<meta name="app-build" content="b13-2026-06-29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --purple:#5B2A8F; --purple-deep:#3C1D6E; --purple-soft:#EDE6F7; --purple-pale:#F6F1FC;
    --cream:#FBF8F2; --ink:#211C29; --ink-soft:#574F60; --ink-mute:#928D9B; --line:#ECE6DE; --line-strong:#DCD5CB;
    --gold:#C89B4F; --green-deep:#149A4A; --red:#E24B4A; --chip-green:#EAF6EC; --chip-green-ink:#2E7D45;
    --display:'Playfair Display',Georgia,serif; --body:'Mulish',system-ui,sans-serif; --scale:1; }
  html[data-size="lg"]{ --scale:1.16; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:var(--body); background:var(--cream); color:var(--ink); display:flex; justify-content:center; font-size:calc(17px*var(--scale)); line-height:1.5; }
  .phone{ width:100%; max-width:430px; height:100vh; height:100dvh; overflow:hidden; position:relative; display:flex; flex-direction:column; background:var(--cream); }
  .hidden{ display:none !important; }
  .logo-f{ width:72px; height:72px; border-radius:22px; background:linear-gradient(145deg,#6E37A6,#3C1D6E); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; color:#fff; font-size:38px; box-shadow:0 10px 24px rgba(60,29,110,.32); }
  .spinner{ width:34px; height:34px; border:3px solid #E7E0F0; border-top-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .center{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; -webkit-overflow-scrolling:touch; }
  .center-inner{ margin:auto; width:100%; padding:42px 26px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .center h1{ font-family:var(--display); font-weight:600; font-size:calc(27px*var(--scale)); margin:22px 0 8px; }
  .center p{ color:var(--ink-soft); font-size:calc(17px*var(--scale)); max-width:330px; }
  .center .err{ color:var(--red); }
  .data-list{ width:100%; text-align:left; margin:24px 0 8px; border-top:1px solid var(--line); }
  .data-list .r{ display:flex; justify-content:space-between; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); font-size:calc(16px*var(--scale)); }
  .data-list .r .lab{ color:var(--ink-mute); } .data-list .r .val{ font-weight:700; text-align:right; }
  .session-note{ font-size:calc(14px*var(--scale)); color:var(--ink-mute); margin:14px 0 22px; }
  .btn{ width:100%; border:0; border-radius:16px; font-family:var(--body); font-size:calc(19px*var(--scale)); font-weight:700; padding:19px 20px; cursor:pointer; background:var(--purple); color:#fff; box-shadow:0 8px 20px rgba(91,42,143,.28); }
  .btn.confirmed{ background:#0E7A4F; box-shadow:0 8px 20px rgba(14,122,79,.26); }
  .btn:disabled{ opacity:.65; cursor:default; }
  .sbox{ width:100%; border-radius:16px; padding:17px 18px; font-weight:700; font-size:calc(18px*var(--scale)); text-align:center; }
  .sbox.ok{ background:#E8F5EF; color:#0E7A4F; }
  .sbox.lost{ background:#FBEAEA; color:#B42318; }
  .sbox.rec{ background:#FFF3E3; color:#A85B08; }
  .sbox.repro{ background:#EAF0FB; color:#2B59B0; }
  .sbox.neutral{ background:#F0EDF6; color:#5B2A8F; }
  .sbox.aviso{ background:#FBF2DE; color:#A85B08; }
  .btn:active{ transform:scale(.985); }
  .btn.ghost{ background:#fff; color:var(--purple); box-shadow:none; border:1.5px solid var(--purple-soft); }
  .btn.danger{ background:#C0392B; box-shadow:0 8px 20px rgba(192,57,43,.22); }
  .linkbtn{ width:100%; border:0; background:transparent; color:var(--ink-mute); font-family:var(--body); font-weight:700; font-size:calc(15px*var(--scale)); padding:14px 0 2px; cursor:pointer; text-decoration:underline; }
  /* botón de todo el paquete (distinto al sólido morado) */
  .packbtn{ width:100%; border:1.5px solid var(--purple-soft); background:#fff; border-radius:16px; padding:15px 16px; margin-top:14px; cursor:pointer; display:flex; align-items:center; gap:13px; text-align:left; font-family:var(--body); }
  .packbtn:active{ transform:scale(.99); }
  .packbtn .pic{ width:42px; height:42px; border-radius:12px; flex:none; background:var(--purple-pale); display:flex; align-items:center; justify-content:center; }
  .packbtn .pic svg{ width:22px; height:22px; stroke:var(--purple); }
  .packbtn .ptx{ flex:1; min-width:0; }
  .packbtn .pt{ display:block; font-weight:700; font-size:calc(16px*var(--scale)); color:var(--purple-deep); }
  .packbtn .ps{ display:block; font-size:calc(13px*var(--scale)); color:var(--ink-mute); margin-top:1px; }
  .packbtn .parr{ color:var(--ink-faint); font-size:calc(22px*var(--scale)); }
  .packbtn.some{ border-color:#BFE6D5; background:#E8F5EF; }
  .packbtn.some .pic{ background:#fff; } .packbtn.some .pic svg{ stroke:#0E7A4F; }
  .packbtn.some .pt{ color:#0E7A4F; } .packbtn.some .ps{ color:#3E8C70; } .packbtn.some .parr{ color:#0E7A4F; }
  /* pill de estado en filas */
  .pill{ border:0; border-radius:999px; padding:10px 15px; font-weight:700; font-size:calc(13.5px*var(--scale)); white-space:nowrap; cursor:pointer; font-family:var(--body); flex:none; }
  .pill.todo{ background:var(--purple-soft); color:var(--purple-deep); }
  .pill.done{ background:#E8F5EF; color:#0E7A4F; }
  .pill.aviso{ background:#FBF2DE; color:#A85B08; }
  .pill.rec{ background:#FFF3E3; color:#A85B08; } .pill.repro{ background:#EAF0FB; color:#2B59B0; } .pill.lost{ background:#FBEAEA; color:#B42318; }
  /* hoja (sheet) */
  .sheet-ov{ position:fixed; inset:0; background:rgba(34,26,43,.45); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; }
  .sheet-ov.show{ opacity:1; pointer-events:auto; }
  .sheet-panel{ width:100%; max-width:460px; background:var(--cream); border-radius:26px 26px 0 0; padding:26px 22px calc(26px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.2); transform:translateY(18px); transition:transform .22s; max-height:88vh; overflow-y:auto; }
  .sheet-ov.show .sheet-panel{ transform:translateY(0); }
  .sh-h{ font-family:var(--display); font-weight:600; font-size:calc(24px*var(--scale)); line-height:1.15; }
  .sh-sub{ color:var(--ink-soft); font-size:calc(15px*var(--scale)); margin:6px 0 4px; }
  .sh-note{ border-radius:14px; padding:14px 16px; margin:16px 0; font-size:calc(14.5px*var(--scale)); line-height:1.5; }
  .sh-note.amber{ background:#FBF2DE; color:#7a5a16; } .sh-note.red{ background:#FBEAEA; color:#9B2C20; } .sh-note.ok{ background:#E8F5EF; color:#0E7A4F; }
  .sheet-panel .btn, .sheet-panel .linkbtn{ margin-top:10px; }
  .cklist{ display:flex; flex-direction:column; gap:10px; margin:16px 0 4px; }
  .ckrow{ width:100%; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 15px; display:flex; align-items:center; gap:14px; cursor:pointer; text-align:left; font-family:var(--body); }
  .ckrow.off{ opacity:.5; }
  .ck{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; }
  .ck.on{ background:var(--purple); color:#fff; } .ck.no{ background:#fff; border:2px solid var(--line); }
  .ckd{ flex:1; min-width:0; } .ckdd{ display:block; font-family:var(--display); font-weight:600; font-size:calc(16px*var(--scale)); } .ckdm{ display:block; color:var(--ink-mute); font-size:calc(13.5px*var(--scale)); margin-top:2px; }
  .ck-tag{ display:inline-block; border-radius:7px; padding:1px 7px; font-size:11px; font-weight:700; margin-left:4px; }
  .ck-tag.done{ background:#E8F5EF; color:#0E7A4F; } .ck-tag.aviso{ background:#FBF2DE; color:#A85B08; }

  #v-app{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .topbar{ flex:none; background:rgba(251,248,242,.96); backdrop-filter:blur(8px); padding:16px 18px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
  .who{ display:flex; align-items:center; gap:11px; min-width:0; }
  .avatar{ width:42px; height:42px; border-radius:50%; background:var(--purple-soft); color:var(--purple-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:calc(15px*var(--scale)); flex-shrink:0; }
  .who .hi{ font-size:calc(13px*var(--scale)); color:var(--ink-mute); line-height:1.1; }
  .who .nm{ font-family:var(--display); font-weight:600; font-size:calc(18px*var(--scale)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-right{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .refresh-btn{ width:40px; height:40px; border:2px solid var(--line-strong); border-radius:12px; background:#fff; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .refresh-btn svg{ width:20px; height:20px; }
  .refresh-btn.spin svg{ animation:spin .8s linear infinite; }
  .size-toggle{ display:flex; border:2px solid var(--line-strong); border-radius:12px; overflow:hidden; background:#fff; }
  .size-toggle button{ border:0; background:transparent; padding:8px 12px; font-family:var(--display); cursor:pointer; color:var(--ink-soft); font-weight:600; line-height:1; }
  .size-toggle button.on{ background:var(--purple); color:#fff; }
  .size-toggle .a1{ font-size:15px; } .size-toggle .a2{ font-size:21px; }

  .body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:22px 22px 30px; }
  .tab{ display:none; } .tab.active{ display:block; }
  .eyebrow{ font-size:calc(13px*var(--scale)); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--purple); }
  .accent{ width:38px; height:4px; border-radius:3px; background:var(--gold); margin:9px 0 18px; }
  .empty{ color:var(--ink-mute); font-size:calc(16px*var(--scale)); padding:18px 0; }

  .next-day{ font-family:var(--display); font-weight:600; font-size:calc(30px*var(--scale)); line-height:1.1; }
  .next-time{ font-family:var(--display); font-weight:600; font-size:calc(46px*var(--scale)); color:var(--purple); line-height:1; margin:4px 0 14px; }
  .next-rows{ display:flex; flex-direction:column; margin-bottom:22px; border-top:1px solid var(--line); }
  .next-rows .r{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:calc(17px*var(--scale)); }
  .next-rows .lab{ color:var(--ink-mute); font-weight:600; } .next-rows .val{ font-weight:700; }
  .micro{ font-size:calc(13.5px*var(--scale)); color:var(--ink-mute); margin-top:12px; line-height:1.45; }
  .divider{ height:1px; background:var(--line-strong); margin:26px 0 20px; }
  /* Mis clases: selector + calendarios */
  .px-lab{ font-size:calc(13px*var(--scale)); font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--purple); margin-bottom:4px; }
  .seg{ display:flex; background:#EEE7DC; border-radius:14px; padding:4px; margin:22px 0 18px; }
  .seg button{ flex:1; border:0; background:transparent; font-family:var(--body); font-weight:700; font-size:calc(15px*var(--scale)); color:var(--ink-soft); padding:10px 0; border-radius:11px; cursor:pointer; -webkit-appearance:none; }
  .seg button.on{ background:#fff; color:var(--purple); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .view.fade{ animation:clfade .2s ease; }
  @keyframes clfade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-ttl{ font-family:var(--display); font-weight:600; font-size:calc(21px*var(--scale)); text-transform:capitalize; }
  .cal-nav button{ width:42px; height:42px; border-radius:50%; border:0; background:transparent; color:var(--ink-soft); font-size:24px; cursor:pointer; -webkit-appearance:none; }
  .dow{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
  .dow span{ text-align:center; font-size:calc(11px*var(--scale)); font-weight:800; color:var(--ink-mute); text-transform:uppercase; }
  .ncirc{ border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .cnum{ font-weight:700; color:var(--ink); }
  .is-today .ncirc{ box-shadow:inset 0 0 0 2px var(--purple); } .is-today .cnum{ color:var(--purple); }
  .is-sel .ncirc{ background:var(--purple); } .is-sel .cnum{ color:#fff; }
  .week{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
  .wcell{ background:transparent; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 0 8px; font-family:var(--body); -webkit-appearance:none; }
  .wcell .wd{ font-size:calc(11px*var(--scale)); font-weight:800; color:var(--ink-mute); text-transform:uppercase; }
  .wcell .ncirc{ width:40px; height:40px; } .wcell .cnum{ font-size:calc(20px*var(--scale)); }
  .wk-hr{ font-size:calc(14px*var(--scale)); font-weight:700; min-height:18px; line-height:1; white-space:nowrap; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cell{ height:var(--cellH,48px); background:transparent; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-family:var(--body); -webkit-appearance:none; }
  .cell.empty{ visibility:hidden; }
  .cell .ncirc{ width:var(--circ,38px); height:var(--circ,38px); } .cell .cnum{ font-size:calc(17px*var(--scale)); }
  .dots{ height:7px; display:flex; gap:3px; }
  .dots i{ width:6px; height:6px; border-radius:50%; }
  .cal-detail{ margin-top:24px; padding-top:18px; border-top:1px solid var(--line-strong); }
  .cal-dh{ font-family:var(--display); font-weight:600; font-size:calc(19px*var(--scale)); margin-bottom:18px; }
  .tl{ position:relative; }
  .tl::before{ content:''; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line-strong); }
  .tl-item{ position:relative; padding:0 0 22px 28px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-node{ position:absolute; left:0; top:6px; width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 4px var(--cream); }
  .tl-time{ font-family:var(--display); font-weight:600; font-size:calc(24px*var(--scale)); line-height:1; }
  .tl-meta{ color:var(--ink-soft); font-size:calc(15px*var(--scale)); margin-top:7px; }
  .tl-meta b{ color:var(--ink); font-weight:700; }
  /* modo calendario (semana/mes): llena el alto entre las barras fijas */
  #app-body.cal{ overflow:hidden; display:flex; flex-direction:column; padding-bottom:14px; }
  #app-body.cal .tab.active{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #app-body.cal #cl-top{ display:none; }
  #app-body.cal .seg{ flex:none; margin:2px 0 16px; }
  #app-body.cal #clases-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #app-body.cal .cal-detail{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; margin-top:12px; padding-top:12px; }
  .group-h{ font-family:var(--display); font-weight:600; font-size:calc(20px*var(--scale)); margin-bottom:4px; color:var(--ink); }
  .group-sub{ font-size:calc(13px*var(--scale)); color:var(--ink-mute); margin-bottom:14px; }
  .pkg-head{ width:100%; border:0; background:transparent; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0; cursor:pointer; text-align:left; font-family:var(--body); color:var(--ink); -webkit-appearance:none; appearance:none; }
  .pkg-head-txt{ min-width:0; }
  .pkg-chev{ width:22px; height:22px; flex:none; color:var(--ink-mute); transition:transform .2s ease; }
  .pkg-head.open .pkg-chev{ transform:rotate(180deg); }
  .pkg-body.collapsed{ display:none; }
  .row{ display:flex; align-items:center; gap:14px; padding:15px 0; border-top:1px solid var(--line); }
  .row.first{ border-top:0; }
  .row .when{ flex:1; min-width:0; }
  .row .when .d{ font-weight:700; font-size:calc(17px*var(--scale)); }
  .row .when .s{ color:var(--ink-soft); font-size:calc(15px*var(--scale)); margin-top:3px; }
  .chk{ flex:none; font-weight:700; font-size:calc(13px*var(--scale)); padding:7px 13px; border-radius:999px; white-space:nowrap; }
  .chk.done{ background:var(--chip-green); color:var(--chip-green-ink); }
  .chk.prox{ background:var(--purple-soft); color:var(--purple-deep); }
  .chk.rec{ background:#FBF1DC; color:#8A6D1A; }
  .chk.repro{ background:#E6EEF9; color:#2C5A9E; }
  .chk.lost{ background:#FBE7E6; color:#B23B39; }
  .chk.sched{ background:#EEEAE2; color:#6F675B; }
  .sk{ background:linear-gradient(90deg,#ECE6DC 25%,#F5F0E8 37%,#ECE6DC 63%); background-size:400% 100%; animation:shimmer 1.25s ease infinite; border-radius:10px; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
  .sk-line{ height:16px; margin:12px 0; } .sk-lg{ height:60px; width:130px; margin:8px 0 16px; border-radius:12px; } .sk-row{ height:62px; margin:14px 0; border-radius:14px; }

  .pkg-num{ font-family:var(--display); font-weight:600; font-size:calc(78px*var(--scale)); color:var(--purple); line-height:.95; }
  .pkg-word{ font-size:calc(20px*var(--scale)); font-weight:600; margin-top:4px; }
  .pkg-bar{ display:flex; gap:7px; margin:22px 0 10px; }
  .pkg-bar .seg{ flex:1; height:15px; border-radius:5px; background:#E7E0F0; }
  .pkg-bar .seg.used{ background:#97C459; }
  .pkg-info{ color:var(--ink-soft); font-size:calc(15px*var(--scale)); }
  .pkg-info b{ color:var(--ink); }
  .legend{ display:flex; flex-wrap:wrap; gap:14px 18px; margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
  .legend span{ display:inline-flex; align-items:center; gap:7px; font-size:calc(13.5px*var(--scale)); color:var(--ink-soft); }
  .legend i{ width:11px; height:11px; border-radius:50%; }
  .legend .g{ background:#2E7D45; } .legend .gd{ background:var(--gold); } .legend .b{ background:#2C5A9E; } .legend .r{ background:var(--red); } .legend .pp{ background:var(--purple); } .legend .ag{ background:#B7AFA2; }

  .nav{ flex:none; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px calc(10px + env(safe-area-inset-bottom)); }
  .nav button{ flex:1; border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; color:var(--ink-mute); }
  .nav button.on{ color:var(--purple); }
  .nav button svg{ width:28px; height:28px; }
  .nav button span{ font-size:calc(13px*var(--scale)); font-weight:600; }
  .toast{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#211C29; color:#fff; padding:12px 18px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; transition:opacity .25s; z-index:30; pointer-events:none; }
  .toast.show{ opacity:.95; }
</style>
</head>
<body>
<div class="phone">

  <div class="center" id="v-loading">
    <div class="center-inner">
      <div class="logo-f">F</div>
      <div class="spinner" style="margin-top:24px;"></div>
      <p id="loading-msg" style="margin-top:18px;">Validando tu acceso…</p>
    </div>
  </div>

  <div class="center hidden" id="v-error">
    <div class="center-inner">
      <div class="logo-f">F</div>
      <h1 id="err-title" class="err"></h1>
      <p id="err-msg"></p>
    </div>
  </div>

  <div class="center hidden" id="v-welcome">
    <div class="center-inner">
      <div class="logo-f">F</div>
      <h1 id="w-hi"></h1>
      <p>Estos son tus datos. Si algo está mal, avísale al estudio.</p>
      <div class="data-list" id="w-data"></div>
      <div class="session-note">Tu sesión quedó activa en este teléfono. La próxima vez entrarás directo.</div>
      <button class="btn" id="w-enter">Ingresar</button>
    </div>
  </div>

  <div class="hidden" id="v-app">
    <div class="topbar">
      <div class="who">
        <div class="avatar" id="t-avatar">··</div>
        <div style="min-width:0;"><div class="hi" id="t-greet">Bienvenida</div><div class="nm" id="t-name">—</div></div>
      </div>
      <div class="tb-right">
        <button class="refresh-btn" id="refresh-btn" title="Actualizar" onclick="refresh(false)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const { createClient } = supabase;
  const SUPABASE_URL = 'https://jcvizioahuqvmhwfnbop.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impjdml6aW9haHVxdm1od2ZuYm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjIzODIsImV4cCI6MjA5MzA5ODM4Mn0.0EYHVITqA85IhtBUbGddHEWcVKIU_MeSzSxrdzNyvhI';
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ detectSessionInUrl:false, persistSession:true, autoRefreshToken:true } });

  const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const $ = (id)=>document.getElementById(id);
  const view = (id)=>{ ['v-loading','v-error','v-welcome','v-app'].forEach(v=>$(v).classList.add('hidden')); $(id).classList.remove('hidden'); };
  const dObj = (iso)=> new Date(iso+'T12:00:00');
  const dayFull = (iso)=>{ const d=dObj(iso); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
  const dayShort = (iso)=>{ const d=dObj(iso); return `${d.getDate()} de ${MESES[d.getMonth()]}`; };
  const fmtHour = (h)=>{ const ap=h<12?'am':'pm'; let hh=h%12; if(hh===0)hh=12; return `${hh}:00 ${ap}`; };
  const esc = (s)=> (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

  let DATA = { me:null, inst:{}, locs:{}, pkgNames:{}, bookings:[], attendance:[], packages:[], sessById:{} };
  let lastFetch = 0, fetching = false, appReady = false;

  // Auto-actualización: si Vercel sirve una versión nueva del archivo, recarga sola.
  let BUILT_TAG = null;
  const MY_BUILD = document.querySelector('meta[name="app-build"]')?.content || '';
  async function fetchTag(){
    const u = location.pathname + '?_v=' + Date.now();
    try{
      const r = await fetch(u, { method:'HEAD', cache:'no-store' });
      const tag = r.headers.get('etag') || r.headers.get('last-modified');
      if(tag) return 'h:'+tag;
    }catch(e){}
    try{
      const r = await fetch(u, { cache:'no-store' });
      const t = await r.text();
      const m = t.match(/name="app-build"\s+content="([^"]+)"/);
      if(m) return 'b:'+m[1];
    }catch(e){}
    return null;
  }
  async function checkUpdate(){
    const t = await fetchTag();
    if(!t) return false;
    if(BUILT_TAG && t !== BUILT_TAG){ try{ sessionStorage.setItem('fit_updated','1'); }catch(e){} location.reload(); return true; }
    if(!BUILT_TAG) BUILT_TAG = t;
    return false;
  }

  function showError(title, msg){ view('v-error'); $('err-title').textContent=title; $('err-msg').textContent=msg||''; }

  async function boot(){
    checkUpdate();
    const token = new URLSearchParams(location.search).get('t');
    const { data:{ session } } = await sb.auth.getSession();
    if (session) return afterAuth();
    if (token){
      $('loading-msg').textContent='Validando tu acceso…';
      let j;
      try{
        const r = await fetch('/api/alumna-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
        j = await r.json();
      }catch(e){ return showError('No pudimos conectar','Revisa tu internet e intenta de nuevo.'); }
      if(!j||!j.ok) return showError('Acceso no válido','Pídele al estudio que te reenvíe tu link por WhatsApp.');
      let vr = await sb.auth.verifyOtp({ token_hash:j.token_hash, type:'email' });
      if(vr.error) vr = await sb.auth.verifyOtp({ email:j.email, token:j.email_otp, type:'magiclink' });
      if(vr.error) return showError('No pudimos iniciar tu sesión', vr.error.message);
      history.replaceState({},'',location.pathname);
      return afterAuth();
    }
    showError('Bienvenida','Abre el link que te enviamos por WhatsApp para entrar a tu cuenta.');
  }

  async function afterAuth(){
    view('v-loading'); $('loading-msg').textContent='Cargando tu cuenta…';
    const { data: me, error } = await sb.from('students')
      .select('id, first_name, last_name, phone, email, gender, app_welcomed_at').limit(1).maybeSingle();
    if(error||!me) return showError('No pudimos cargar tu cuenta', error?.message||'Intenta de nuevo.');
    DATA.me = me;
    if(!me.app_welcomed_at) return showWelcome(me);
    return loadApp();
  }

  function showWelcome(me){
    view('v-welcome');
    $('w-hi').textContent = `¡Hola, ${me.first_name}!`;
    $('w-data').innerHTML = `
      <div class="r"><span class="lab">Nombre</span><span class="val">${esc(me.first_name)} ${esc(me.last_name||'')}</span></div>
      <div class="r"><span class="lab">Número</span><span class="val">${esc(me.phone||'—')}</span></div>
      <div class="r"><span class="lab">Correo</span><span class="val">${esc(me.email||'Sin correo')}</span></div>`;
    $('w-enter').onclick = async ()=>{
      $('w-enter').textContent='Entrando…'; $('w-enter').disabled=true;
      try{ await sb.rpc('student_mark_welcomed'); }catch(e){}
      loadApp();
    };
  }

  async function fetchAll(){
    if(fetching) return; fetching = true;
    try{
      const [insR, locR, pkgR, bkR, atR, spR] = await Promise.all([
        sb.from('instructors').select('id, first_name'),
        sb.from('locations').select('id, name, color'),
        sb.from('packages').select('id, name'),
        sb.from('session_bookings').select('id, session_id, cancelled_at, confirmed_at, cancel_requested_at'),
        sb.from('attendance').select('id, session_id, status, student_package_id'),
        sb.from('student_packages').select('id, classes_total, classes_used, status, is_active, is_frozen, purchase_date, expiration_date, closed_at, replaces_id, package_id'),
      ]);
      const inst={}; (insR.data||[]).forEach(i=>inst[i.id]=i.first_name);
      const locs={}, locColor={}; (locR.data||[]).forEach(l=>{ locs[l.id]=l.name; locColor[l.id]=l.color||'#5B2A8F'; });
      const pkgNames={}; (pkgR.data||[]).forEach(p=>pkgNames[p.id]=p.name);
      DATA.inst=inst; DATA.locs=locs; DATA.locColor=locColor; DATA.pkgNames=pkgNames;
      DATA.bookings = bkR.data||[];
      DATA.attendance = atR.data||[];
      DATA.packages = spR.data||[];
      const ids = [...new Set([...DATA.bookings.map(b=>b.session_id), ...DATA.attendance.map(a=>a.session_id)].filter(Boolean))];
      const sessById={};
      if(ids.length){
        const { data: sess } = await sb.from('class_sessions').select('id, session_date, hour, instructor_id, location_id, is_cancelled').in('id', ids);
        (sess||[]).forEach(s=>sessById[s.id]=s);
      }
      DATA.sessById = sessById;
      lastFetch = Date.now();
    } finally { fetching = false; }
  }

  function renderAll(){ renderClases(); renderPaquete(); }

  async function loadApp(){
    view('v-loading'); $('loading-msg').textContent='Cargando tus clases…';
    const me = DATA.me;
    $('t-name').textContent = me.first_name;
    $('t-greet').textContent = me.gender==='M' ? 'Bienvenido' : (me.gender==='F' ? 'Bienvenida' : 'Hola');
    $('t-avatar').textContent = ((me.first_name?.[0]||'')+(me.last_name?.[0]||'')).toUpperCase()||'··';
    await fetchAll();
    renderAll();
    appReady = true;
    view('v-app');
    goTab('clases', $('n-clases'));
    try{ if(sessionStorage.getItem('fit_updated')){ sessionStorage.removeItem('fit_updated'); toast('Actualizado a la última versión'); } }catch(e){}
    subscribeStudentRealtime();
  }

  // Tiempo real: si el estudio marca/cambia su asistencia o reserva, la app se actualiza sola
  let _stuRtChannel = null, _stuRtTimer = null;
  function subscribeStudentRealtime(){
    if(_stuRtChannel || !sb || !DATA.me) return;
    const sid = DATA.me.id;
    try{
      _stuRtChannel = sb.channel('rt-alumna-'+sid)
        .on('postgres_changes', { event:'*', schema:'public', table:'attendance', filter:'student_id=eq.'+sid }, _stuRtRefresh)
        .on('postgres_changes', { event:'*', schema:'public', table:'session_bookings', filter:'student_id=eq.'+sid }, _stuRtRefresh)
        .subscribe();
    }catch(e){}
  }
  function _stuRtRefresh(){ clearTimeout(_stuRtTimer); _stuRtTimer = setTimeout(()=>{ if(appReady) refresh(true); }, 700); }

  function skeletonHTML(){
    return `<div class="sk sk-line" style="width:42%"></div><div class="sk sk-lg"></div>`
      + `<div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>`;
  }

  async function refresh(silent){
    const btn = $('refresh-btn'); if(btn) btn.classList.add('spin');
    if(await checkUpdate()) return;
    if(!silent){ $('tab-clases').innerHTML = skeletonHTML(); $('tab-pkg').innerHTML = skeletonHTML(); }
    const tasks = [fetchAll()];
    if(!silent) tasks.push(new Promise(r=>setTimeout(r,450)));
    await Promise.all(tasks);
    renderAll();
    if(btn) btn.classList.remove('spin');
    if(!silent) toast('Actualizado');
  }

  function isUpcoming(sess, att){
    if(!sess || sess.is_cancelled) return false;
    if(att && ['attended','lost','no_show','recoverable','rescheduled'].includes(att.status)) return false;
    const now = new Date();
    const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    if(sess.session_date>todayIso) return true;
    if(sess.session_date<todayIso) return false;
    return sess.hour >= now.getHours();
  }

  function classStartMs(s){ return new Date(`${s.session_date}T${String(s.hour).padStart(2,'0')}:00:00`).getTime(); }
  const CLASS_DUR_MS = 60*60*1000;          // duración aproximada de la clase
  const CARD_BUFFER_MS = 2*60*60*1000;      // sigue visible hasta 2h DESPUÉS de terminar
  const CLASS_ACTIVE_MS = CLASS_DUR_MS + CARD_BUFFER_MS;  // futura/en curso/post-clase
  function cardStatusBox(status){
    if(status==='attended')    return {cls:'ok',    label:'Asististe',          note:'El estudio registró tu asistencia a esta clase.'};
    if(status==='recoverable') return {cls:'rec',   label:'Falta recuperable',  note:'Esta clase quedó como recuperable. Coordina con tu coordinadora para recuperarla.'};
    if(status==='rescheduled') return {cls:'repro', label:'Reprogramada',       note:'Esta clase se movió a otra fecha.'};
    if(status==='lost'||status==='no_show') return {cls:'lost', label:'Falta registrada', note:'El estudio registró que no asististe a esta clase.'};
    return {cls:'ok', label:'Registrada', note:''};
  }

  const CL = { view:'lista', weekStart:null, mesY:null, mesM:null, sel:null };
  let CLE = { upcoming:[], events:[], next:null };
  function fmtHourClean(h){ const ap=h<12?'am':'pm'; let hh=h%12; if(hh===0)hh=12; return `${hh} ${ap}`; }
  function clTodayIso(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
  function clMondayOf(i){ const d=dObj(i); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }
  function clIso(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  function clOnDate(di){ return CLE.events.filter(e=>e.date===di).sort((a,b)=>a.hour-b.hour); }

  function renderClases(){
    const now = Date.now();
    const attBySession={}; DATA.attendance.forEach(a=>{ attBySession[a.session_id]=a; });
    const events=[];
    DATA.bookings.forEach(b=>{
      if(b.cancelled_at) return;
      const s=DATA.sessById[b.session_id]; if(!s||s.is_cancelled) return;
      const start=classStartMs(s);
      if(now - start >= CLASS_ACTIVE_MS) return;   // ya pasó (más de 2h tras terminar) → al historial vía asistencia
      const att=attBySession[b.session_id];
      events.push({ date:s.session_date, hour:s.hour, loc:s.location_id, inst:s.instructor_id, sid:s.id, kind:'up', bid:b.id, conf:b.confirmed_at, cancel:b.cancel_requested_at, status: att?att.status:null, start });
    });
    DATA.attendance.forEach(a=>{
      const s=DATA.sessById[a.session_id]; if(!s) return;
      const start=classStartMs(s);
      if(now - start < CLASS_ACTIVE_MS) return;    // aún vigente → ya está como 'up' (evita duplicado)
      events.push({ date:s.session_date, hour:s.hour, loc:s.location_id, inst:s.instructor_id, sid:s.id, kind:'att', status:a.status, start });
    });
    const upcoming = events.filter(e=>e.kind==='up').sort((a,b)=> a.start-b.start);
    CLE = { upcoming, events, next: upcoming[0]||null };
    if(CL.sel==null) CL.sel = clTodayIso();

    const el=$('tab-clases');
    if(events.length===0){
      $('app-body')?.classList.remove('cal');
      el.innerHTML = `<div class="eyebrow">Mis clases</div><div class="accent"></div>
        <div class="empty">No tienes clases agendadas. Cuando el estudio te agende una, aparecerá aquí.</div>`;
      return;
    }
    const next = CLE.next;
    let html = `<div id="cl-top"><div class="eyebrow">Mis clases</div><div class="accent"></div>`;
    if(next){
      const start = next.start, started = start <= now, ended = now >= start + CLASS_DUR_MS;
      html += `<div class="px-lab">${started ? 'Tu clase de hoy' : 'Tu próxima clase'}</div>
        <div class="next-day">${dayFull(next.date)}</div>
        <div class="next-time">${fmtHour(next.hour)}</div>
        <div class="next-rows">
          <div class="r"><span class="lab">Profesor</span><span class="val">${esc(DATA.inst[next.inst]||'—')}</span></div>
          <div class="r"><span class="lab">Sede</span><span class="val">${esc(DATA.locs[next.loc]||'—')}</span></div>
        </div>`;
      if(next.status){
        const sbx = cardStatusBox(next.status);
        html += `<div class="sbox ${sbx.cls}">${sbx.label}</div>${sbx.note?`<div class="micro">${sbx.note}</div>`:''}`;
      } else if(!started){
        if(next.cancel){
          html += `<div class="sbox aviso">Avisaste que no vendrás</div>
            <div class="micro">La coordinadora se pondrá en contacto contigo.</div>
            <button class="btn ghost" style="margin-top:12px" onclick="confirmar('${next.bid}', false)">Sí voy a venir</button>`;
        } else if(next.conf){
          html += `<button class="btn confirmed" id="confbtn" onclick="confirmar('${next.bid}', true)">Asistencia confirmada</button>
            <button class="linkbtn" onclick="openClassSheet('${next.bid}')">No podré ir a esta clase</button>`;
        } else {
          html += `<button class="btn" id="confbtn" onclick="confirmar('${next.bid}', false)">Confirmar mi asistencia</button>
            <button class="linkbtn" onclick="openClassSheet('${next.bid}')">No podré ir a esta clase</button>`;
        }
      } else if(!ended){
        html += (next.conf
          ? `<div class="sbox ok">Asistencia confirmada</div><div class="micro">Tu clase está en curso. El estudio registrará tu asistencia al terminar.</div>`
          : `<div class="sbox neutral">Clase en curso</div><div class="micro">Tu clase está en curso.</div>`);
      } else {
        html += `<div class="sbox neutral">Clase terminada</div><div class="micro">El estudio registrará tu asistencia pronto.</div>`;
      }
    } else {
      html += `<div class="empty">No tienes una próxima clase agendada por ahora.</div>`;
    }
    let bulkBtn = '';
    {
      const future = upcoming.filter(e => e.bid && !e.status && e.start > now);
      const total = future.length;
      if(total >= 2){
        const confCount = future.filter(e => e.conf).length;
        if(confCount === 0){
          bulkBtn = `<button class="packbtn" onclick="openPackSheet()">
            <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span>
            <span class="ptx"><span class="pt">Confirmar mis ${total} clases</span><span class="ps">Revisa y confirma todas de una vez</span></span>
            <span class="parr">&rsaquo;</span></button>`;
        } else {
          bulkBtn = `<button class="packbtn some" onclick="openPackSheet()">
            <span class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span class="ptx"><span class="pt">${confCount} de ${total} clases confirmadas</span><span class="ps">Toca para gestionar o avisar ausencias</span></span>
            <span class="parr">&rsaquo;</span></button>`;
        }
      }
    }
    html += `</div>${bulkBtn}
      <div class="seg">
        <button class="${CL.view==='lista'?'on':''}" onclick="clView('lista',this)">Lista</button>
        <button class="${CL.view==='semana'?'on':''}" onclick="clView('semana',this)">Semana</button>
        <button class="${CL.view==='mes'?'on':''}" onclick="clView('mes',this)">Mes</button>
      </div>
      <div class="view" id="clases-view"></div>`;
    el.innerHTML = html;
    renderClasesView();
  }

  function applyClasesMode(){
    const cal = (CL.view==='semana' || CL.view==='mes');
    const b=$('app-body'); if(b) b.classList.toggle('cal', cal);
  }

  window.clView=(v,btn)=>{ CL.view=v; document.querySelectorAll('#tab-clases .seg button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); renderClasesView(); };
  window.clPick=(di)=>{ CL.sel=di; renderClasesView(); };
  window.clShiftWeek=(n)=>{ CL.weekStart=new Date(CL.weekStart); CL.weekStart.setDate(CL.weekStart.getDate()+n*7); renderClasesView(); };
  window.clShiftMes=(n)=>{ CL.mesM+=n; if(CL.mesM<0){CL.mesM=11;CL.mesY--;} if(CL.mesM>11){CL.mesM=0;CL.mesY++;} renderClasesView(); };

  function renderClasesView(){
    const box=$('clases-view'); if(!box) return;
    applyClasesMode();
    box.classList.remove('fade'); void box.offsetWidth; box.classList.add('fade');
    box.innerHTML = CL.view==='lista' ? clLista() : (CL.view==='semana' ? clSemana() : clMes());
    if(CL.view==='mes') requestAnimationFrame(fitMonth);
  }

  function fitMonth(){
    if(CL.view!=='mes') return;
    const body=$('app-body'), view=$('clases-view'); if(!body||!view) return;
    const grid=view.querySelector('.grid'); if(!grid) return;
    const seg=document.querySelector('#tab-clases .seg');
    const calnav=view.querySelector('.cal-nav');
    const dow=view.querySelector('.dow');
    const avail=body.clientHeight;
    const overhead=(seg?seg.offsetHeight+18:0)+(calnav?calnav.offsetHeight+16:0)+(dow?dow.offsetHeight+8:0)+24;
    const r=Math.ceil(grid.children.length/7) || 6;
    let cellH=Math.floor((avail-overhead-150)/r);
    cellH=Math.max(34, Math.min(cellH, 62));
    const circ=Math.max(26, Math.min(cellH-12, 40));
    grid.style.setProperty('--cellH', cellH+'px');
    grid.style.setProperty('--circ', circ+'px');
  }

  function clLista(){
    const rest = CLE.next ? CLE.upcoming.slice(1) : CLE.upcoming;
    let h=`<div class="group-h">Más adelante</div>`;
    if(rest.length===0) return h+`<div class="empty">No tienes más clases programadas por ahora.</div>`;
    const now=Date.now();
    rest.forEach((e,i)=>{
      let pill='';
      if(e.bid && !e.status && e.start>now){
        if(e.cancel) pill=`<button class="pill aviso" onclick="openClassSheet('${e.bid}')">Avisaste que no irás</button>`;
        else if(e.conf) pill=`<button class="pill done" onclick="openClassSheet('${e.bid}')">Confirmada ✓</button>`;
        else pill=`<button class="pill todo" onclick="openClassSheet('${e.bid}')">Por confirmar</button>`;
      } else if(e.status){
        const sc=stateChip(e.status); pill=`<span class="pill ${sc[0]}">${sc[1]}</span>`;
      }
      h+=`<div class="row${i===0?' first':''}"><div class="when"><div class="d">${dayFull(e.date)}</div><div class="s">${fmtHour(e.hour)} · ${esc(DATA.locs[e.loc]||'—')} · con ${esc(DATA.inst[e.inst]||'—')}</div></div>${pill}</div>`;
    });
    return h;
  }

  function clSemana(){
    if(!CL.weekStart) CL.weekStart=clMondayOf(clTodayIso());
    const ws=CL.weekStart, end=new Date(ws); end.setDate(end.getDate()+6);
    const today=clTodayIso();
    const ttl=`${ws.getDate()} ${MESES[ws.getMonth()].slice(0,3)} – ${end.getDate()} ${MESES[end.getMonth()].slice(0,3)}`;
    let cells='';
    for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); const di=clIso(d.getFullYear(),d.getMonth(),d.getDate()); const cs=clOnDate(di);
      const cls=['wcell']; if(di===today)cls.push('is-today'); if(di===CL.sel)cls.push('is-sel');
      const hr= cs.length ? `<span class="wk-hr" style="color:${DATA.locColor[cs[0].loc]||'#5B2A8F'}">${fmtHourClean(cs[0].hour)}</span>` : `<span class="wk-hr"></span>`;
      cells+=`<button class="${cls.join(' ')}" onclick="clPick('${di}')"><span class="wd">${DOW[i]}</span><span class="ncirc"><span class="cnum">${d.getDate()}</span></span>${hr}</button>`;
    }
    return `<div class="cal-nav"><button onclick="clShiftWeek(-1)">‹</button><div class="cal-ttl">${ttl}</div><button onclick="clShiftWeek(1)">›</button></div><div class="week">${cells}</div>${clDetail()}`;
  }

  function clMes(){
    if(CL.mesY==null){ const t=dObj(clTodayIso()); CL.mesY=t.getFullYear(); CL.mesM=t.getMonth(); }
    const today=clTodayIso();
    const lead=(new Date(CL.mesY,CL.mesM,1).getDay()+6)%7, days=new Date(CL.mesY,CL.mesM+1,0).getDate();
    let cells='';
    for(let i=0;i<lead;i++) cells+=`<div class="cell empty"></div>`;
    for(let d=1;d<=days;d++){ const di=clIso(CL.mesY,CL.mesM,d); const cs=clOnDate(di);
      const cls=['cell']; if(di===today)cls.push('is-today'); if(di===CL.sel)cls.push('is-sel');
      const dots= cs.length ? `<div class="dots">${[...new Set(cs.map(c=>c.loc))].slice(0,3).map(l=>`<i style="background:${DATA.locColor[l]||'#5B2A8F'}"></i>`).join('')}</div>` : `<div class="dots"></div>`;
      cells+=`<button class="${cls.join(' ')}" onclick="clPick('${di}')"><span class="ncirc"><span class="cnum">${d}</span></span>${dots}</button>`;
    }
    return `<div class="cal-nav"><button onclick="clShiftMes(-1)">‹</button><div class="cal-ttl">${MESES[CL.mesM]} ${CL.mesY}</div><button onclick="clShiftMes(1)">›</button></div>
      <div class="dow"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="grid">${cells}</div>${clDetail()}`;
  }

  function clDetail(){
    const cs=clOnDate(CL.sel);
    let h=`<div class="cal-detail"><div class="cal-dh">${dayFull(CL.sel)}</div>`;
    if(!cs.length) return h+`<div class="empty">No tienes clases este día.</div></div>`;
    h+=`<div class="tl">`;
    cs.forEach(e=>{
      const col=DATA.locColor[e.loc]||'#5B2A8F';
      const st = e.kind==='up'
        ? (e.status ? stateChip(e.status)[1] : ((CLE.next && e.sid===CLE.next.sid) ? 'Próxima' : 'Agendada'))
        : stateChip(e.status)[1];
      h+=`<div class="tl-item"><span class="tl-node" style="background:${col}"></span><div class="tl-time">${fmtHour(e.hour)}</div><div class="tl-meta"><b>${esc(DATA.locs[e.loc]||'—')}</b> · con ${esc(DATA.inst[e.inst]||'—')} · ${st}</div></div>`;
    });
    return h+`</div></div>`;
  }

  function stateChip(status){
    if(status==='attended') return ['done','Asististe ✓'];
    if(status==='recoverable') return ['rec','Recuperable'];
    if(status==='rescheduled') return ['repro','Reprogramada'];
    if(status==='lost'||status==='no_show') return ['lost','Perdida'];
    return ['done','Asististe ✓'];
  }

  function renderPaquete(){
    const el=$('tab-pkg');
    const valid = DATA.packages.filter(p=> p.status!=='changed' && !p.closed_at);
    const isDone = (p)=> (p.classes_used||0) >= (p.classes_total||0);
    const asc = [...valid].sort((a,b)=>(a.purchase_date||'').localeCompare(b.purchase_date||'') || (a.start_date||'').localeCompare(b.start_date||''));
    // entre los no completados, el ACTIVO es el que ya empezó (tiene clases tomadas); si ninguno empezó, el más antiguo
    const candidates = asc.filter(p=> !p.is_frozen && !isDone(p));
    const active = candidates.find(p=> (p.classes_used||0) > 0) || candidates[0];
    const pname = (p)=> DATA.pkgNames[p.package_id] || 'Paquete';

    if(valid.length===0){
      el.innerHTML = `<div class="eyebrow">Mi paquete</div><div class="accent"></div>
        <div class="empty">Aún no tienes un paquete activo. Cuando compres uno, aquí verás cuántas clases te quedan.</div>`;
      return;
    }

    let html = `<div class="eyebrow">Tu paquete actual</div><div class="accent"></div>`;
    if(active){
      const total=active.classes_total||0, used=active.classes_used||0, remain=Math.max(0,total-used);
      let segs=''; for(let i=0;i<total;i++) segs+=`<div class="seg${i<used?' used':''}"></div>`;
      html += `<div class="pkg-num">${remain}</div><div class="pkg-word">clases te quedan</div>
        <div class="pkg-bar">${segs}</div>
        <div class="pkg-info"><b>${esc(pname(active))}</b>${active.expiration_date?` · vence el <b>${dayShort(active.expiration_date)}</b>`:''}</div>`;
    } else {
      html += `<div class="empty">No tienes un paquete con clases disponibles ahora mismo.</div>`;
    }

    const attBySession={}; DATA.attendance.forEach(a=>{ if(a.session_id) attBySession[a.session_id]=a; });
    const upcoming = DATA.bookings
      .map(b=>({ b, s:DATA.sessById[b.session_id] }))
      .filter(x=> x.s && !x.b.cancelled_at && isUpcoming(x.s, attBySession[x.b.session_id]))
      .map(x=>x.s);

    // la clase realmente "próxima" es la más cercana en fecha+hora (solo esa lleva el tag Próxima)
    const nextId = (upcoming.slice().sort((a,b)=> a.session_date.localeCompare(b.session_date) || a.hour-b.hour)[0]||{}).id;

    const rowsByPkg={};
    const activeId = active?.id;
    DATA.attendance.forEach(a=>{ const s=DATA.sessById[a.session_id]; if(!s) return; const pid=a.student_package_id||activeId; if(!pid) return; (rowsByPkg[pid]=rowsByPkg[pid]||[]).push({ s, att:a }); });
    if(activeId) upcoming.forEach(s=>{ (rowsByPkg[activeId]=rowsByPkg[activeId]||[]).push({ s, prox:true }); });

    const lastDate = (pid)=>{ let m=''; (rowsByPkg[pid]||[]).forEach(r=>{ if(r.s.session_date>m) m=r.s.session_date; }); return m; };
    const others = valid.filter(p=> p.id!==activeId);
    const proximos = others.filter(p=> !isDone(p)).sort((a,b)=>(a.purchase_date||'').localeCompare(b.purchase_date||''));
    const anteriores = others.filter(p=> isDone(p)).sort((a,b)=>{ const da=lastDate(a.id)||a.purchase_date||'', db=lastDate(b.id)||b.purchase_date||''; return db.localeCompare(da); });
    const order = [activeId, ...proximos.map(p=>p.id), ...anteriores.map(p=>p.id)].filter(Boolean);

    order.forEach(pid=>{
      const p = valid.find(x=>x.id===pid); if(!p) return;
      const all = rowsByPkg[pid]||[];
      const ups = all.filter(r=>r.prox).sort((a,b)=> a.s.session_date.localeCompare(b.s.session_date) || a.s.hour-b.s.hour);
      const dones = all.filter(r=>!r.prox).sort((a,b)=> b.s.session_date.localeCompare(a.s.session_date) || b.s.hour-a.s.hour);
      const rows = [...ups, ...dones];
      const total=p.classes_total||0, used=p.classes_used||0, remain=Math.max(0,total-used);
      let label, sub;
      if(pid===activeId){ label='Paquete actual'; sub=`${total} clases · ${used} tomadas · ${remain} te quedan`; }
      else if(!isDone(p)){ label='Paquete próximo'; sub=`${total} clases · empieza cuando termines el actual`; }
      else { label='Paquete anterior'; sub=`${total} clases · completado`; }
      const open = (pid===activeId);
      html += `<div class="divider"></div>`;
      html += `<button class="pkg-head${open?' open':''}" onclick="togglePkg('${pid}', this)"><div class="pkg-head-txt"><div class="group-h">${label}</div><div class="group-sub" style="margin-bottom:0;">${sub}</div></div><svg class="pkg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>`;
      html += `<div class="pkg-body${open?'':' collapsed'}" id="body-${pid}">`;
      if(rows.length===0){ html+=`<div class="empty">Sin clases registradas todavía.</div>`; }
      rows.forEach((r,i)=>{
        let cls,label2;
        if(r.prox){ if(r.s.id===nextId){ cls='prox'; label2='Próxima'; } else { cls='sched'; label2='Agendada'; } }
        else { [cls,label2]=stateChip(r.att.status); }
        html += `<div class="row${i===0?' first':''}"><div class="when"><div class="d">${dayFull(r.s.session_date)}</div><div class="s">${fmtHour(r.s.hour)} · ${esc(DATA.locs[r.s.location_id]||'—')} · con ${esc(DATA.inst[r.s.instructor_id]||'—')}</div></div><span class="chk ${cls}">${label2}</span></div>`;
      });
      html += `</div>`;
    });

    html += `<div class="legend"><span><i class="pp"></i> Próxima</span><span><i class="ag"></i> Agendada</span><span><i class="g"></i> Asististe</span><span><i class="gd"></i> Recuperable</span><span><i class="b"></i> Reprogramada</span><span><i class="r"></i> Perdida</span></div>`;
    el.innerHTML = html;
  }

  window.goTab=(name,btn)=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    $('tab-'+name).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    if(name==='clases'){ applyClasesMode(); } else { $('app-body').classList.remove('cal'); }
    $('app-body').scrollTop = 0;
    // si los datos están viejos (>15s), refresca en silencio al cambiar de pestaña
    if(appReady && Date.now()-lastFetch > 15000) refresh(true);
  };
  window.setSize=(mode,el)=>{ document.documentElement.setAttribute('data-size', mode==='lg'?'lg':'normal'); el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); if(CL.view==='mes') requestAnimationFrame(fitMonth); };
  window.togglePkg=(pid, btn)=>{ const b=$('body-'+pid); if(!b) return; b.classList.toggle('collapsed'); btn.classList.toggle('open'); };
  window.confirmar = async (bid, isConfirmed)=>{
    if(!bid){ toast('No encontramos tu reserva'); return; }
    const btn = document.getElementById('confbtn');
    if(btn){ btn.disabled = true; btn.textContent = isConfirmed ? 'Quitando…' : 'Confirmando…'; }
    try{
      const { data, error } = await sb.rpc('student_confirm_booking', { p_booking_id: bid, p_confirm: !isConfirmed });
      if(error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      const conf = row ? row.confirmed_at : (isConfirmed ? null : new Date().toISOString());
      const b = DATA.bookings.find(x=>x.id===bid); if(b){ b.confirmed_at = conf; if(conf) b.cancel_requested_at = null; }
      renderClases();
      closeSheet();
      toast(conf ? 'Asistencia confirmada' : 'Confirmación quitada');
    }catch(e){
      const msg = (e && e.message) || '';
      if(/empez/i.test(msg)) toast('La clase ya empezó. Escríbele a tu coordinadora.');
      else if(/cancel/i.test(msg)) toast('Esa clase está cancelada.');
      else toast('No se pudo guardar. Intenta de nuevo.');
      if(btn){ btn.disabled = false; btn.textContent = isConfirmed ? 'Asistencia confirmada' : 'Confirmar mi asistencia'; }
    }
  };

  // ======= Hoja (sheet) + flujos de ausencia y confirmación múltiple =======
  let PACK_SEL = {};
  function _bk(bid){ return DATA.bookings.find(x=>x.id===bid) || null; }
  function _bkInfo(bid){
    const b=_bk(bid); if(!b) return null;
    const s=DATA.sessById[b.session_id]; if(!s) return null;
    const start=classStartMs(s);
    return { b, s, start, hrs:(start-Date.now())/3600000, line:`${dayFull(s.session_date)} · ${fmtHour(s.hour)}`, sede:esc(DATA.locs[s.location_id]||'—') };
  }
  function openSheet(inner){
    let ov=$('sheet');
    if(!ov){ ov=document.createElement('div'); ov.id='sheet'; ov.className='sheet-ov'; document.body.appendChild(ov); ov.addEventListener('click',e=>{ if(e.target===ov) closeSheet(); }); }
    ov.innerHTML=`<div class="sheet-panel">${inner}</div>`;
    requestAnimationFrame(()=>ov.classList.add('show'));
  }
  window.closeSheet=()=>{ const ov=$('sheet'); if(ov) ov.classList.remove('show'); };

  window.openClassSheet=(bid)=>{
    const info=_bkInfo(bid); if(!info){ toast('No encontramos tu reserva'); return; }
    const b=info.b; let body;
    if(b.cancel_requested_at){
      body=`<div class="sh-h">¿Vas a venir?</div><div class="sh-sub">${info.line} · ${info.sede}</div>
        <div class="sh-note amber"><b>Avisaste que no vendrás.</b> La coordinadora se pondrá en contacto contigo.</div>
        <button class="btn" onclick="confirmar('${bid}', false)">Sí, voy a venir</button>
        <button class="linkbtn" onclick="closeSheet()">Cerrar</button>`;
    } else if(b.confirmed_at){
      body=`<div class="sh-h">Tu clase</div><div class="sh-sub">${info.line} · ${info.sede}</div>
        <div class="sh-note ok">Confirmaste tu asistencia.</div>
        <button class="btn ghost" onclick="confirmar('${bid}', true)">Quitar confirmación</button>
        <button class="btn danger" onclick="askAbsence('${bid}')">No podré ir</button>
        <button class="linkbtn" onclick="closeSheet()">Cerrar</button>`;
    } else {
      body=`<div class="sh-h">Tu clase</div><div class="sh-sub">${info.line} · ${info.sede}</div>
        <button class="btn" onclick="confirmar('${bid}', false)">Confirmar mi asistencia</button>
        <button class="btn danger" onclick="askAbsence('${bid}')">No podré ir</button>
        <button class="linkbtn" onclick="closeSheet()">Cerrar</button>`;
    }
    openSheet(body);
  };

  window.askAbsence=(bid)=>{
    const info=_bkInfo(bid); if(!info){ toast('No encontramos tu reserva'); return; }
    const note = info.hrs < 4
      ? `<div class="sh-note red"><b>Faltan menos de 4 horas.</b> Si avisas ahora, esta clase se descuenta de tu paquete. La coordinadora se pondrá en contacto contigo.</div>`
      : `<div class="sh-note amber">Avísale al estudio si cambias de planes. Aún estás a tiempo: no se te descuenta la clase.</div>`;
    openSheet(`<div class="sh-h">¿Ya no podrás venir?</div><div class="sh-sub">${info.line} · ${info.sede}</div>
      ${note}
      <button class="btn danger" id="absbtn" onclick="doAbsence('${bid}')">Avisar que no podré ir</button>
      <button class="btn ghost" onclick="openClassSheet('${bid}')">Mejor no</button>`);
  };

  window.doAbsence=async (bid)=>{
    const btn=$('absbtn'); if(btn){ btn.disabled=true; btn.textContent='Avisando…'; }
    try{
      const { error } = await sb.rpc('student_request_absence', { p_booking_id: bid, p_request: true });
      if(error) throw error;
      const b=_bk(bid); if(b){ b.cancel_requested_at=new Date().toISOString(); b.confirmed_at=null; }
      closeSheet(); renderClases(); toast('Listo, le avisamos al estudio');
    }catch(e){
      const msg=(e&&e.message)||'';
      if(/empez/i.test(msg)) toast('La clase ya empezó. Escríbele a tu coordinadora.');
      else toast('No se pudo avisar. Intenta de nuevo.');
      if(btn){ btn.disabled=false; btn.textContent='Avisar que no podré ir'; }
    }
  };

  function _packFuture(){ const now=Date.now(); return CLE.upcoming.filter(e=> e.bid && !e.status && e.start>now); }
  window.openPackSheet=()=>{
    const future=_packFuture();
    if(!future.length){ toast('No tienes clases por confirmar'); return; }
    PACK_SEL={}; future.forEach(e=>{ PACK_SEL[e.bid] = !e.conf; });  // pre-marca las que faltan confirmar
    _renderPackSheet(future);
  };
  function _renderPackSheet(future){
    let rows='';
    future.forEach(e=>{
      const on=!!PACK_SEL[e.bid];
      const sub=`${fmtHour(e.hour)} · ${esc(DATA.locs[e.loc]||'—')} · con ${esc(DATA.inst[e.inst]||'—')}`;
      const tag = e.conf ? `<span class="ck-tag done">Ya confirmada</span>` : (e.cancel ? `<span class="ck-tag aviso">Avisaste que no irás</span>` : '');
      rows+=`<button class="ckrow ${on?'':'off'}" onclick="togglePack('${e.bid}')"><span class="ck ${on?'on':'no'}">${on?'✓':''}</span><span class="ckd"><span class="ckdd">${dayFull(e.date)}</span><span class="ckdm">${sub} ${tag}</span></span></button>`;
    });
    const n=Object.values(PACK_SEL).filter(Boolean).length;
    openSheet(`<div class="sh-h">Confirma tus clases</div><div class="sh-sub">Deja marcadas a las que vendrás y destilda las que no.</div>
      <div class="cklist">${rows}</div>
      <div class="sh-note amber">Si no vas a poder venir a alguna, avísale al estudio con al menos 4 horas de anticipación. Con menos de 4 horas esa clase se descuenta de tu paquete, pero la coordinadora se pondrá en contacto contigo.</div>
      <button class="btn" id="packbtn" onclick="submitPack()" ${n?'':'disabled'}>Confirmar ${n} ${n===1?'clase':'clases'}</button>
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>`);
  }
  window.togglePack=(bid)=>{ PACK_SEL[bid]=!PACK_SEL[bid]; _renderPackSheet(_packFuture()); };
  window.submitPack=async ()=>{
    const toConfirm=_packFuture().filter(e=> PACK_SEL[e.bid] && !e.conf);
    if(!toConfirm.length){ closeSheet(); return; }
    const btn=$('packbtn'); if(btn){ btn.disabled=true; btn.textContent='Confirmando…'; }
    let okN=0;
    await Promise.all(toConfirm.map(async e=>{
      try{
        const { data, error } = await sb.rpc('student_confirm_booking', { p_booking_id: e.bid, p_confirm: true });
        if(error) throw error;
        const row=Array.isArray(data)?data[0]:data;
        const b=_bk(e.bid); if(b){ b.confirmed_at = row?row.confirmed_at:new Date().toISOString(); b.cancel_requested_at=null; }
        okN++;
      }catch(_){}
    }));
    closeSheet(); renderClases();
    toast(okN ? `Confirmaste ${okN} ${okN===1?'clase':'clases'}` : 'No se pudo confirmar. Intenta de nuevo.');
  };

  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && appReady){ checkUpdate().then(up=>{ if(!up && Date.now()-lastFetch > 8000) refresh(true); }); } });

  window.addEventListener('resize', ()=>{ if(CL.view==='mes') fitMonth(); });
  setInterval(()=>{ if(document.visibilityState==='visible' && appReady) checkUpdate(); }, 25000);

  boot();
</script>
</body>
</html>
