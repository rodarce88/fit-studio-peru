<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Multi Stream v4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0b; color: #e8e8ea; font-family: -apple-system, system-ui, sans-serif; padding: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; padding: 10px; background: #141416; border-radius: 8px; margin-bottom: 12px; flex-wrap: wrap; border: 1px solid #2a2a2e; }
  input, button { padding: 7px 12px; font-size: 13px; border-radius: 6px; border: 1px solid #2a2a2e; background: #0a0a0b; color: #e8e8ea; font-family: inherit; }
  input { flex: 1; min-width: 220px; }
  button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; color: white; font-weight: 500; }
  button:hover { background: #2563eb; }
  button.danger { background: transparent; color: #ef4444; border-color: #ef4444; }
  h1 { font-size: 16px; font-weight: 500; margin-right: 8px; }
  .grid-config { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #8a8a92; }
  .grid-config input[type=number] { width: 50px; padding: 5px 6px; }

  .top { display: grid; grid-template-columns: 1fr 260px; gap: 12px; margin-bottom: 16px; }
  .main-player { background: #141416; overflow: hidden; aspect-ratio: 16/9; border: 1px solid #2a2a2e; position: relative; }
  .main-player iframe { width: 100%; height: 100%; border: 0; transform: translateZ(0); }
  .main-player .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #5a5a62; font-size: 14px; padding: 20px; text-align: center; }
  .main-player .label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 10; font-weight: 500; }

  .sidebar { background: #141416; border-radius: 8px; border: 1px solid #2a2a2e; overflow: hidden; display: flex; flex-direction: column; }
  .sidebar-header { padding: 10px 12px; border-bottom: 1px solid #2a2a2e; font-size: 12px; color: #8a8a92; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  .sidebar-list { flex: 1; overflow-y: auto; }
  .stream-item { padding: 10px 12px; border-bottom: 1px solid #1c1c1f; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 6px; }
  .stream-item:hover { background: #1c1c1f; }
  .stream-item.active { background: #1e3a5f; border-left: 3px solid #3b82f6; padding-left: 9px; }
  .stream-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .stream-item .remove-btn { padding: 3px 6px; font-size: 11px; background: transparent; border: 1px solid #2a2a2e; color: #8a8a92; border-radius: 4px; cursor: pointer; opacity: 0; }
  .stream-item:hover .remove-btn { opacity: 1; }
  .stream-item .remove-btn:hover { color: white; border-color: #ef4444; background: #ef4444; }

  .bottom-section { margin-top: 16px; }
  .bottom-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: #8a8a92; }
  .grid { display: grid; gap: 6px; }
  .stream-small { background: #141416; overflow: hidden; position: relative; aspect-ratio: 16/9; border: 1px solid #2a2a2e; contain: layout style paint; }
  .stream-small iframe { width: 100%; height: 100%; border: 0; transform: translateZ(0); }
  .stream-small .label { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.75); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .stream-small:hover .label { opacity: 1; }
  .stream-small .controls-row { position: absolute; bottom: 6px; left: 6px; right: 6px; display: flex; gap: 4px; z-index: 10; opacity: 0; transition: opacity 0.15s; }
  .stream-small:hover .controls-row { opacity: 1; }
  .stream-small .controls-row button { flex: 1; padding: 4px 8px; font-size: 11px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; border-radius: 4px; font-family: inherit; }
  .stream-small .controls-row button:hover { background: rgba(0,0,0,0.95); }
  .stream-small .controls-row button.audio-on { background: #10b981; border-color: #10b981; }
  .stream-small .controls-row button.is-main-btn { background: #3b82f6; border-color: #3b82f6; }
  .stream-small.is-main { outline: 2px solid #3b82f6; }
</style>
</head>
<body>

<div class="controls">
  <h1>Multi Stream</h1>
  <input type="text" id="urlInput" placeholder="Link de YouTube">
  <input type="text" id="labelInput" placeholder="Nombre" style="flex: 0 0 140px; min-width: 100px;">
  <button onclick="addStream()">+ Agregar</button>
  <div class="grid-config">
    <span>Columnas:</span>
    <input type="number" id="colsInput" value="2" min="1" max="6" onchange="updateGrid()">
    <button onclick="muteAll()" style="background: transparent; color: #8a8a92; border-color: #2a2a2e;">🔇 Mute</button>
    <button onclick="clearAll()" class="danger">Limpiar</button>
  </div>
</div>

<div class="top">
  <div class="main-player" id="mainPlayer">
    <div class="empty">Selecciona un stream de la lista</div>
  </div>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Streams</span>
      <span id="countLabel">0</span>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>
</div>

<div class="bottom-section" id="bottomSection" style="display:none;">
  <div class="bottom-header">
    <span>Todos en vivo</span>
    <span style="font-size: 11px;">Hover para controles · 🔊 escuchar · A principal = mandar arriba</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
let streams = JSON.parse(localStorage.getItem('multistream_v4') || '[]');
let cols = parseInt(localStorage.getItem('multistream_v4_cols') || '2');
let mainIdx = parseInt(localStorage.getItem('multistream_v4_main') || '-1');
let audibleIdx = null;

document.getElementById('colsInput').value = cols;

function saveState() {
  localStorage.setItem('multistream_v4', JSON.stringify(streams));
  localStorage.setItem('multistream_v4_cols', cols.toString());
  localStorage.setItem('multistream_v4_main', mainIdx.toString());
}

function extractVideoId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// Main player: full quality, all features
function mainEmbedUrl(videoId) {
  return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0`;
}

// Grid player: stripped down — no controls, no annotations, no related, no keyboard, low quality
function gridEmbedUrl(videoId, muted) {
  return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=${muted ? 1 : 0}&vq=small&controls=0&modestbranding=1&rel=0&disablekb=1&fs=0&iv_load_policy=3&playsinline=1`;
}

function addStream() {
  const urlInput = document.getElementById('urlInput');
  const labelInput = document.getElementById('labelInput');
  const url = urlInput.value.trim();
  const label = labelInput.value.trim();
  if (!url) return;
  const videoId = extractVideoId(url);
  if (!videoId) { alert('Link no válido'); return; }
  streams.push({ videoId, label: label || `Stream ${streams.length + 1}`, url });
  if (mainIdx === -1) mainIdx = streams.length - 1;
  urlInput.value = '';
  labelInput.value = '';
  saveState();
  renderAll();
}

function removeStream(idx, event) {
  if (event) event.stopPropagation();
  streams.splice(idx, 1);
  if (mainIdx === idx) mainIdx = streams.length > 0 ? 0 : -1;
  else if (mainIdx > idx) mainIdx--;
  if (audibleIdx === idx) audibleIdx = null;
  else if (audibleIdx !== null && audibleIdx > idx) audibleIdx--;
  saveState();
  renderAll();
}

function clearAll() {
  if (!confirm('¿Eliminar todos?')) return;
  streams = [];
  mainIdx = -1;
  audibleIdx = null;
  saveState();
  renderAll();
}

function updateGrid() {
  cols = parseInt(document.getElementById('colsInput').value) || 2;
  if (cols < 1) cols = 1;
  if (cols > 6) cols = 6;
  saveState();
  renderGrid();
}

function setMain(idx, event) {
  if (event) event.stopPropagation();
  if (mainIdx === idx) return;
  mainIdx = idx;
  if (audibleIdx === idx) audibleIdx = null;
  saveState();
  renderMainOnly();
  renderSidebar();
  updateGridActive();
  reloadGridItem(idx, true);
  updateAudioButtons();
}

function toggleAudio(idx, event) {
  event.stopPropagation();
  if (audibleIdx === idx) {
    audibleIdx = null;
    reloadGridItem(idx, true);
  } else {
    const previousAudible = audibleIdx;
    audibleIdx = idx;
    if (previousAudible !== null) reloadGridItem(previousAudible, true);
    reloadGridItem(idx, false);
  }
  updateAudioButtons();
}

function muteAll() {
  if (audibleIdx !== null) {
    const prev = audibleIdx;
    audibleIdx = null;
    reloadGridItem(prev, true);
    updateAudioButtons();
  }
}

function reloadGridItem(idx, muted) {
  const el = document.querySelector(`.stream-small[data-idx="${idx}"] iframe`);
  if (!el) return;
  const s = streams[idx];
  el.src = gridEmbedUrl(s.videoId, muted);
}

function updateAudioButtons() {
  document.querySelectorAll('.stream-small').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const btn = el.querySelector('.audio-btn');
    if (btn) {
      btn.classList.toggle('audio-on', idx === audibleIdx);
      btn.textContent = idx === audibleIdx ? '🔊 Sonando' : '🔇 Escuchar';
    }
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMainOnly() {
  const el = document.getElementById('mainPlayer');
  if (mainIdx === -1 || !streams[mainIdx]) {
    el.innerHTML = '<div class="empty">Selecciona un stream</div>';
    return;
  }
  const s = streams[mainIdx];
  el.innerHTML = `
    <div class="label">${escapeHtml(s.label)}</div>
    <iframe src="${mainEmbedUrl(s.videoId)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  `;
}

function renderSidebar() {
  const el = document.getElementById('sidebarList');
  document.getElementById('countLabel').textContent = streams.length;
  if (streams.length === 0) {
    el.innerHTML = '<div style="padding: 20px; text-align: center; color: #5a5a62; font-size: 12px;">Sin streams</div>';
    return;
  }
  el.innerHTML = streams.map((s, idx) => `
    <div class="stream-item ${idx === mainIdx ? 'active' : ''}" onclick="setMain(${idx})">
      <span class="name">${escapeHtml(s.label)}</span>
      <button class="remove-btn" onclick="removeStream(${idx}, event)">×</button>
    </div>
  `).join('');
}

function renderGrid() {
  const bottom = document.getElementById('bottomSection');
  const grid = document.getElementById('grid');
  if (streams.length <= 1) { bottom.style.display = 'none'; return; }
  bottom.style.display = 'block';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = streams.map((s, idx) => {
    const isMuted = idx !== audibleIdx;
    return `
    <div class="stream-small ${idx === mainIdx ? 'is-main' : ''}" data-idx="${idx}">
      <div class="label">${escapeHtml(s.label)}</div>
      <iframe src="${gridEmbedUrl(s.videoId, isMuted)}" allow="autoplay; encrypted-media" loading="lazy"></iframe>
      <div class="controls-row">
        <button class="audio-btn ${idx === audibleIdx ? 'audio-on' : ''}" onclick="toggleAudio(${idx}, event)">
          ${idx === audibleIdx ? '🔊 Sonando' : '🔇 Escuchar'}
        </button>
        <button class="is-main-btn" onclick="setMain(${idx}, event)">
          ${idx === mainIdx ? '✓ Principal' : 'A principal'}
        </button>
      </div>
    </div>
  `;
  }).join('');
}

function updateGridActive() {
  document.querySelectorAll('.stream-small').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.classList.toggle('is-main', idx === mainIdx);
    const btn = el.querySelector('.is-main-btn');
    if (btn) btn.textContent = idx === mainIdx ? '✓ Principal' : 'A principal';
  });
}

function renderAll() {
  renderMainOnly();
  renderSidebar();
  renderGrid();
}

document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') addStream(); });
document.getElementById('labelInput').addEventListener('keydown', e => { if (e.key === 'Enter') addStream(); });

renderAll();
</script>

</body>
</html>
